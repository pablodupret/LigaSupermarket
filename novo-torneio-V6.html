
<!DOCTYPE html>

<html lang="pt-br">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Central de Torneios — Liga Supermarket</title>
<style>
/* ===================================================================
   LIGA SUPERMARKET — Central de Torneios
   Design system local: Dark Tournament Dashboard.

   O CSS fica INLINE de propósito. "Salvar este Dia (HTML)" grava
   document.documentElement.outerHTML num arquivo avulso; um <link> para
   uma folha externa faria esse arquivo abrir sem estilo nenhum fora
   desta pasta.
   =================================================================== */

/* -------------------------------------------------------- tokens -- */
:root {
  --bg-page:       #0f1114;   /* grafite quase preto, levemente azulado */
  --bg-surface:    #171a1f;   /* cards principais                        */
  --bg-elevated:   #1e222a;   /* blocos dentro de cards                  */
  --bg-inset:      #12151a;   /* campos, confrontos, código              */

  --border:        #2a2f38;
  --border-strong: #3a4150;

  --text:          #eceef2;   /* branco quebrado */
  --text-dim:      #9aa3b2;
  --text-faint:    #6b7484;

  --accent:        #d9b166;   /* dourado sóbrio, parente do site         */
  --accent-hover:  #e6c37e;
  --accent-soft:   rgba(217, 177, 102, .12);
  --accent-ink:    #14171d;

  --success:       #4ade80;   /* concluído / salvo      */
  --info:          #60a5fa;   /* rodada atual / informação */
  --warning:       #fbbf24;   /* atenção / correção     */
  --danger:        #f87171;   /* erro / perigo          */

  --radius:        14px;
  --radius-sm:     9px;
  --shadow:        0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.22);
  --t:             160ms ease;
  --mono:          ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

/* ---------------------------------------------------------- base -- */
*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  padding: 26px 0 72px;
  background: var(--bg-page);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
               Helvetica, Arial, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}

h1, h2, h3 { margin: 0 0 .55em; line-height: 1.25; font-weight: 650;
             letter-spacing: -.01em; }
p { margin: 0 0 .8em; }
p:last-child { margin-bottom: 0; }

/* -------------------------------------------------------- layout -- */
.container,
.app-header,
#torneio-header {
  width: min(100% - 32px, 1200px);
  margin-left: auto;
  margin-right: auto;
}

.container {
  margin-bottom: 20px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 26px;
}

/* -------------------------------------------------------- header -- */
.app-header { display: flex; align-items: center; gap: 16px; margin-bottom: 22px; }

.app-header .mark {
  width: 54px; height: 54px; flex: none;
  border-radius: 15px;
  display: grid; place-items: center;
  font-size: 26px;
  background: linear-gradient(155deg, var(--bg-elevated), var(--bg-surface));
  border: 1px solid var(--border-strong);
}
.app-header .brand {
  font-size: .7rem; letter-spacing: .2em; text-transform: uppercase;
  color: var(--accent); font-weight: 700;
}
.app-header h1 { font-size: 1.55rem; margin: 2px 0 3px; }
.app-header .tagline { margin: 0; color: var(--text-dim); font-size: .92rem; }

/* --------------------------------------------------------- cards -- */
.card {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 20px;
  margin-bottom: 18px;
}
.card:last-child { margin-bottom: 0; }

.card-title {
  font-size: .74rem; letter-spacing: .14em; text-transform: uppercase;
  color: var(--text-dim); font-weight: 700; margin: 0 0 16px;
}
.card-title-extra { color: var(--text-faint); font-weight: 600; }

/* --------------------------------------------------------- forms -- */
.field-grid {
  display: grid; gap: 14px 18px;
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label,
.field-legenda { font-size: .82rem; color: var(--text-dim); font-weight: 600; }

/* Seletor de rodadas: radios de verdade, desenhados como círculos.
   O <input> fica transparente por cima do círculo inteiro — some da vista mas
   continua focável, navegável pelas setas e clicável em toda a área. */
.rodadas { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 2px; }
.rodada-op { position: relative; display: inline-flex; }
.rodada-op input[type=radio] {
  position: absolute; inset: 0; margin: 0;
  width: 100%; height: 100%;
  opacity: 0; cursor: pointer;
}
.rodada-bola {
  width: 46px; height: 46px; border-radius: 50%;
  display: grid; place-items: center;
  font-size: 1.05rem; font-weight: 700;
  font-variant-numeric: tabular-nums;
  background: var(--bg-inset);
  border: 1px solid var(--border);
  color: var(--text-dim);
  transition: background var(--t), border-color var(--t), color var(--t);
}
.rodada-op:hover .rodada-bola { border-color: var(--border-strong); color: var(--text); }
.rodada-op input[type=radio]:focus-visible + .rodada-bola {
  border-color: var(--accent); color: var(--text);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.rodada-op input[type=radio]:checked + .rodada-bola {
  background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
}

input[type=text], input[type=date], input[type=number] {
  width: 100%;
  padding: 11px 12px;
  font: inherit; font-size: .95rem;
  color: var(--text);
  background: var(--bg-inset);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  transition: border-color var(--t), box-shadow var(--t);
}
input[type=text]:focus, input[type=date]:focus, input[type=number]:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
input::placeholder { color: var(--text-faint); }

/* ------------------------------------------------------- botões --- */
button {
  font: inherit; font-weight: 600;
  cursor: pointer;
  padding: 11px 18px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
  background: var(--bg-elevated);
  color: var(--text);
  transition: background var(--t), border-color var(--t), color var(--t);
}
button:hover { border-color: var(--text-faint); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { cursor: not-allowed; opacity: .45; }
button:disabled:hover { border-color: var(--border-strong); }

/* Ação principal da situação. Os botões criados por JS são alcançados
   pelo id/atributo, para as funções de domínio não precisarem mudar. */
.btn-primary,
#btn-iniciar,
#btn-proxima-auto,
#btn-exportar,
#pp-copiar-publicar {
  background: var(--accent); color: var(--accent-ink); border-color: var(--accent);
}
.btn-primary:hover,
#btn-iniciar:hover,
#btn-proxima-auto:hover,
#btn-exportar:hover,
#pp-copiar-publicar:hover {
  background: var(--accent-hover); border-color: var(--accent-hover);
}
/* Respiro depois do card de encerramento, para o botão não encostar na borda. */
#btn-exportar { font-size: 1.02rem; padding: 13px 24px;
                display: inline-block; margin-top: 18px; }

/* Manutenção: não pode competir com avançar o torneio. */
.btn-ghost,
[id^="btn-reabrir-"] {
  background: transparent; color: var(--text-dim); border-color: var(--border);
  font-weight: 600; font-size: .9rem; padding: 9px 15px;
}
.btn-ghost:hover,
[id^="btn-reabrir-"]:hover { color: var(--text); border-color: var(--border-strong); }

.btn-danger {
  background: transparent; color: var(--danger);
  border-color: rgba(248,113,113,.32); font-size: .9rem; padding: 9px 15px;
}
.btn-danger:hover { border-color: var(--danger); }

.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }

/* --------------------------------------------------- participantes */
.players {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 8px;
  max-height: 330px;
  overflow-y: auto;
  padding: 2px;
  scrollbar-width: thin;
  scrollbar-color: rgba(217,177,102,.45) transparent;
}

/* Barra de rolagem visível de verdade.
   No macOS a barra é "overlay" e só aparece durante a rolagem; declarar uma
   largura em ::-webkit-scrollbar faz o Safari desenhar a barra clássica, que
   fica sempre à vista. É o que dá a pista de que a lista continua. */
.players::-webkit-scrollbar { width: 12px; }
.players::-webkit-scrollbar-track {
  background: rgba(0,0,0,.28);
  border-radius: 999px;
  margin: 2px 0;
}
.players::-webkit-scrollbar-thumb {
  background: rgba(217,177,102,.42);
  border-radius: 999px;
  border: 3px solid transparent;      /* afina o polegar sem afinar a pista */
  background-clip: padding-box;
}
.players::-webkit-scrollbar-thumb:hover {
  background: rgba(217,177,102,.7);
  background-clip: padding-box;
}

/* Véu no rodapé enquanto ainda há gente abaixo da área visível. O `right`
   deixa a barra de rolagem de fora, senão ela apareceria esmaecida. */
.players-wrap { position: relative; }
.players-wrap::after {
  content: "";
  position: absolute; left: 0; right: 12px; bottom: 0;
  height: 44px;
  pointer-events: none;
  opacity: 0;
  transition: opacity var(--t);
  background: linear-gradient(to top, var(--bg-elevated), rgba(30,34,42,0));
}
.players-wrap.tem-mais::after { opacity: 1; }

.scroll-dica { display: none; margin-top: 8px; font-size: .78rem;
               color: var(--accent); opacity: .8; }
.players-wrap.tem-mais + .scroll-dica { display: block; }
.player-row {
  display: flex; align-items: center; gap: 11px;
  padding: 8px 12px;
  background: var(--bg-inset);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background var(--t), border-color var(--t);
}
.player-row:hover { border-color: var(--border-strong); }
.player-row:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.player-row input[type=checkbox] {
  width: 17px; height: 17px; flex: none; margin: 0;
  accent-color: var(--accent); cursor: pointer;
}
.avatar-sm, .avatar-xs, .avatar-md {
  border-radius: 50%; object-fit: cover; flex: none;
  background: var(--bg-elevated); border: 1px solid var(--border-strong);
}
.avatar-xs { width: 32px; height: 32px; }
.avatar-sm { width: 40px; height: 40px; }
.avatar-md { width: 52px; height: 52px; border-width: 2px; }
.player-row .nome { min-width: 0; overflow: hidden;
                    text-overflow: ellipsis; white-space: nowrap; }
.player-row:has(input:checked) {
  background: var(--accent-soft); border-color: var(--accent);
}

/* Contador em destaque */
.count-bar { display: flex; align-items: center; gap: 14px;
             flex-wrap: wrap; margin-top: 16px; }
.count-pill {
  display: inline-flex; align-items: baseline; gap: 8px;
  padding: 8px 15px; border-radius: 999px;
  background: var(--bg-inset); border: 1px solid var(--border);
}
.count-pill strong { font-size: 1.35rem; color: var(--accent);
                     font-variant-numeric: tabular-nums; }
.count-pill span { color: var(--text-dim); font-size: .88rem; }

.warn-inline { display: none; }
.warn-inline.on {
  display: inline-flex; align-items: center; gap: 8px;
  color: var(--warning); font-size: .88rem;
}

/* Confirmação (o JS alterna display:none / block) */
#confirmacao-jogadores {
  margin-top: 18px; padding: 20px;
  border: 1px solid var(--accent);
  border-radius: var(--radius-sm);
  background: var(--accent-soft);
}
.confirm-count { color: var(--text-dim); font-size: .9rem; }
.confirm-count b { color: var(--text); font-size: 1.05rem; }
.confirm-list {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 8px; margin: 14px 0 0; padding: 0; list-style: none;
}
.confirm-item {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 11px;
  background: var(--bg-inset); border: 1px solid var(--border);
  border-radius: var(--radius-sm);
}
.confirm-item .nome { min-width: 0; overflow: hidden;
                      text-overflow: ellipsis; white-space: nowrap; }

/* ------------------------------------------------------- callouts - */
.callout {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 12px 14px; border-radius: var(--radius-sm);
  font-size: .9rem; border: 1px solid;
}
.callout--warn { color: var(--warning); border-color: rgba(251,191,36,.35);
                 background: rgba(251,191,36,.07); }
.callout--info { color: var(--info); border-color: rgba(96,165,250,.32);
                 background: rgba(96,165,250,.07); }

/* --------------------------------------------- cabeçalho do torneio */
#torneio-header {
  margin-bottom: 20px; padding: 22px 24px;
  background: linear-gradient(150deg, #1b1f27, #14181f);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.th-top { display: flex; justify-content: space-between;
          align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.th-liga { font-size: 1.45rem; font-weight: 700; letter-spacing: .03em; }
.th-meta { color: var(--text-dim); font-size: .9rem; }
.th-status {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: .72rem; font-weight: 700; letter-spacing: .11em;
  text-transform: uppercase; padding: 6px 13px; border-radius: 999px;
  border: 1px solid; white-space: nowrap;
}
.th-status--live { color: var(--info);    border-color: rgba(96,165,250,.32);
                   background: rgba(96,165,250,.1); }
.th-status--done { color: var(--success); border-color: rgba(74,222,128,.32);
                   background: rgba(74,222,128,.1); }
.th-status--fix  { color: var(--warning); border-color: rgba(251,191,36,.32);
                   background: rgba(251,191,36,.1); }

/* Trilha de progresso das rodadas */
.rail { display: flex; align-items: flex-start; margin-top: 22px; }
.rail-step { display: flex; flex-direction: column; align-items: center;
             gap: 6px; flex: none; }
.rail-dot {
  width: 26px; height: 26px; border-radius: 50%;
  display: grid; place-items: center;
  font-size: .7rem; font-weight: 700;
  border: 2px solid var(--border-strong);
  background: var(--bg-inset); color: var(--text-faint);
}
.rail-num { font-size: .72rem; color: var(--text-faint);
            font-variant-numeric: tabular-nums; }
.rail-step--done .rail-dot { border-color: var(--success); color: var(--success); }
.rail-step--now .rail-dot {
  border-color: var(--info); color: var(--info);
  background: rgba(96,165,250,.15);
  box-shadow: 0 0 0 4px rgba(96,165,250,.1);
}
.rail-step--now .rail-num { color: var(--info); font-weight: 700; }
.rail-line { flex: 1 1 auto; height: 2px; margin: 12px 5px 0;
             background: var(--border); }
.rail-line--done { background: var(--success); opacity: .45; }

/* Status do autosave */
.save-badge {
  display: inline-flex; align-items: center; gap: 7px;
  margin-top: 18px; padding: 5px 12px; border-radius: 999px;
  font-size: .8rem; color: var(--success);
  background: rgba(74,222,128,.08); border: 1px solid rgba(74,222,128,.22);
}

/* ------------------------------------------------------- rodadas -- */
.rodada-bloco {
  margin-top: 22px; padding: 20px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.rodada-bloco.round--past { opacity: .6; transition: opacity var(--t); }
.rodada-bloco.round--past:hover { opacity: 1; }
.rodada-bloco.round--fix { border-color: rgba(251,191,36,.4); }

.round-head {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 12px; flex-wrap: wrap;
  margin-bottom: 16px; padding-bottom: 13px;
  border-bottom: 1px solid var(--border);
}
.round-title { margin: 0; font-size: 1.2rem; font-weight: 700;
               letter-spacing: .05em; text-transform: uppercase; }
.round-sub { color: var(--text-dim); font-size: .87rem; }

.round-actions { display: flex; gap: 10px; flex-wrap: wrap;
                 margin-top: 18px; padding-top: 16px;
                 border-top: 1px solid var(--border); }

/* --------------------------------------------------- confrontos --- */
.matches { display: flex; flex-direction: column; gap: 12px;
           counter-reset: mesa; }

.match {
  counter-increment: mesa;
  position: relative;
  display: grid; grid-template-columns: 1fr auto 1fr;
  align-items: center; gap: 14px;
  padding: 30px 18px 17px;
  background: var(--bg-inset);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
}
.match::before {
  content: "Mesa " counter(mesa);
  position: absolute; top: 10px; left: 18px;
  font-size: .66rem; letter-spacing: .16em; text-transform: uppercase;
  color: var(--text-faint); font-weight: 700;
}
/* Cada lado ocupa uma coluna larga (1fr), mas o CONTEÚDO se encosta na coluna
   central. O resultado é um núcleo compacto — nome · avatar · placar · VS ·
   placar · avatar · nome — em vez de dois jogadores presos às bordas do card.
   A coluna do meio segue no centro geométrico, então o VS fica alinhado
   verticalmente entre todos os confrontos da rodada.

   A inversão faz duas coisas de uma vez: empurra o conteúdo para dentro e
   coloca o avatar ao lado do placar, com o nome por fora. O DOM continua sendo
   avatar + nome nos dois lados — nenhuma mudança de markup. */
.match-side {
  display: flex; align-items: center; gap: 11px; min-width: 0;
  flex-direction: row-reverse;      /* esquerda: nome · avatar → */
  text-align: right;
}
.match-side--r {
  flex-direction: row;              /* direita: ← avatar · nome */
  text-align: left;
}
.match-side .nome { font-weight: 600; min-width: 0;
                    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.match-score { display: flex; align-items: center; justify-content: center;
               gap: 9px; flex-wrap: wrap; }
.match-score input[type=number] {
  width: 60px; padding: 9px 4px;
  text-align: center; font-size: 1.15rem; font-weight: 700;
  font-variant-numeric: tabular-nums;
}
/* Símbolo VS entre os dois placares. É decoração: não recebe clique, para
   nunca disputar o toque com os campos que estão de cada lado. */
.vs-simbolo {
  width: 36px; height: 36px; flex: none;
  object-fit: contain;
  opacity: .92;
  filter: drop-shadow(0 2px 5px rgba(0,0,0,.45));
  pointer-events: none;
  -webkit-user-select: none; user-select: none;
}

.match-score .final {
  font-size: 1.35rem; font-weight: 700; letter-spacing: .04em;
  font-variant-numeric: tabular-nums; white-space: nowrap;
  min-width: 1.2em; text-align: center;
}
/* Nota de games empatados: linha própria embaixo, como o campo de empates. */
.match-score .emp-nota {
  flex: 1 0 100%; text-align: center;
  font-size: .74rem; font-weight: 600; color: var(--text-dim);
}

/* O JS alterna entre display:none e display:inline neste span, então o
   layout tem de funcionar sem depender de flex aqui. */
.emp-wrap { flex: 1 0 100%; text-align: center;
            font-size: .78rem; color: var(--text-dim); }
.emp-wrap input[type=number] {
  width: 3.4em; padding: 5px 4px; margin-left: 6px;
  font-size: .95rem; font-weight: 600;
}

.emp-toggle {
  display: inline-flex; align-items: center; gap: 8px;
  margin-top: 14px; font-size: .84rem; color: var(--text-dim); cursor: pointer;
}
.emp-toggle input[type=checkbox] { width: 15px; height: 15px; margin: 0;
                                   accent-color: var(--accent); }

/* Bye da rodada */
.bye-card {
  display: flex; align-items: center; gap: 14px;
  padding: 16px 18px; border-radius: var(--radius-sm);
  background: rgba(96,165,250,.06);
  border: 1px dashed rgba(96,165,250,.35);
}
.bye-card .bye-icon { font-size: 1.5rem; flex: none; }
.bye-card .bye-label { font-size: .66rem; letter-spacing: .16em;
                       text-transform: uppercase; color: var(--info);
                       font-weight: 700; }
.bye-card .nome { font-weight: 700; font-size: 1.05rem; }
.bye-card .bye-sub { color: var(--text-dim); font-size: .85rem; }
.bye-mp {
  margin-left: auto; flex: none;
  font-weight: 700; font-size: .84rem; color: var(--success);
  background: rgba(74,222,128,.1); border: 1px solid rgba(74,222,128,.25);
  padding: 5px 12px; border-radius: 999px;
}

/* -------------------------------------------- tabelas / rankings -- */
.ranking { margin-top: 26px; }
.ranking h3 { font-size: 1.05rem; }
.ranking .nota { color: var(--text-dim); font-size: .84rem; }

.table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch;
                border: 1px solid var(--border); border-radius: var(--radius-sm); }

table { width: 100%; border-collapse: collapse; font-size: .94rem; }
thead th {
  text-align: left; white-space: nowrap;
  font-size: .68rem; letter-spacing: .12em; text-transform: uppercase;
  color: var(--text-dim); font-weight: 700;
  padding: 11px 13px;
  background: var(--bg-inset);
  border-bottom: 1px solid var(--border-strong);
}
tbody td { padding: 10px 13px; border-bottom: 1px solid var(--border);
           vertical-align: middle; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: rgba(255,255,255,.025); }
.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

.rank-pos { width: 58px; font-weight: 700; color: var(--text-dim);
            font-variant-numeric: tabular-nums; white-space: nowrap; }
.rank-player { display: flex; align-items: center; gap: 10px; min-width: 0; }
.rank-player .nome { min-width: 0; overflow: hidden;
                     text-overflow: ellipsis; white-space: nowrap; }
.rank-mp { font-weight: 700; color: var(--accent); }

<script>
function baixarPagina() {
  const html = document.documentElement.outerHTML;
  const blob = new Blob([html], { type: "text/html" });
  const link = document.createElement("a");
  const nomeArquivo = prompt("Digite o nome do arquivo (ex: dia-03.html):", "dia-03.html") || "dia-x.html";
  link.href = URL.createObjectURL(blob);
  link.download = nomeArquivo;
  link.click();
}
</script>
<!-- Selecionar Jogadores -->
<script>
function idDoJogador(nome) {
  return "jog_" + nome.replace(/\s+/g, "_");
}

// Monta a linha de UM jogador como um nó novo, pronto para appendChild.
//
// É de propósito que esta função devolva um elemento em vez de uma string de
// HTML para ser concatenada na lista: `div.innerHTML += ...` reserializa o
// container inteiro e recria TODOS os checkboxes. Como `checked` é propriedade
// (e não atributo), toda a seleção anterior era perdida a cada jogador
// acrescentado; e como `data-listener="1"` é atributo, ele sobrevivia à
// reserialização e fazia vincularEventosCheckbox() pular os elementos novos —
// então os listeners não voltavam e o contador congelava.
//
// Acrescentando um nó por vez, os que já estão na tela não são tocados.
// A linha inteira é um <label> que ENVOLVE o checkbox: clicar em qualquer
// ponto (inclusive na foto) alterna a seleção, sem nenhum JS, e o teclado
// continua funcionando normalmente. O checkbox real segue sendo a fonte da
// seleção — nada aqui é um controle apenas visual.
function criarLinhaJogador(nome) {
  const id = idDoJogador(nome);
  const linha = document.createElement("label");
  linha.className = "player-row";
  linha.innerHTML =
    `<input type="checkbox" value="${nome}" id="${id}" />` +
    imgAvatar(nome, "avatar-sm") +
    `<span class="nome">${nome}</span>`;
  return linha;
}

// ---------------------------------------------------------------------------
// Afordância de rolagem da lista de participantes.
//
// Tudo aqui é leitura: conta linhas e mede a rolagem. Não mexe em carregamento,
// seleção nem no contador de selecionados.
// ---------------------------------------------------------------------------

// Quantas pessoas a lista tem hoje — as do cadastro mais as acrescentadas à mão.
function atualizarTotalCadastrados() {
  const rotulo = document.getElementById("total-cadastrados");
  if (!rotulo) return;

  const total = document.querySelectorAll("#lista-jogadores input[type=checkbox]").length;
  rotulo.textContent = total ? ` · ${total} cadastrados` : "";
}

// Liga o véu e a dica quando ainda há conteúdo abaixo do que está visível, e
// desliga os dois ao chegar no fim.
function atualizarDicaDeRolagem() {
  const lista = document.getElementById("lista-jogadores");
  const area = document.getElementById("area-participantes");
  if (!lista || !area) return;

  // A folga de 4px evita que um arredondamento de subpixel mantenha a dica
  // acesa com a lista já no fim.
  const faltaVer = (lista.scrollHeight - lista.clientHeight - lista.scrollTop) > 4;
  area.className = faltaVer ? "players-wrap tem-mais" : "players-wrap";
}

function ligarRolagemDaLista() {
  const lista = document.getElementById("lista-jogadores");
  if (!lista || !lista.addEventListener || lista._rolagemLigada) return;
  lista._rolagemLigada = true;

  lista.addEventListener("scroll", atualizarDicaDeRolagem);
  if (typeof window !== "undefined" && window.addEventListener) {
    // Girar o aparelho ou redimensionar muda quanto cabe na área visível.
    window.addEventListener("resize", atualizarDicaDeRolagem);
  }
}

async function carregarJogadores() {
  try {
    const res = await fetch("jogadores.json");
    const lista = await res.json();
    const div = document.getElementById("lista-jogadores");
    div.innerHTML = "";

    lista.sort((a, b) => a.localeCompare(b, 'pt-BR'));

    lista.forEach(nome => div.appendChild(criarLinhaJogador(nome)));

    vincularEventosCheckbox();
    atualizarContadorSelecionados();
    atualizarTotalCadastrados();
    ligarRolagemDaLista();
    atualizarDicaDeRolagem();



  } catch (err) {
    document.getElementById("lista-jogadores").innerText = "Erro ao carregar jogadores.";
  }
}

function adicionarJogador() {
  const nome = document.getElementById("novo-jogador").value.trim();
  if (!nome) return;
  if (document.getElementById(idDoJogador(nome))) {
    alert("Jogador já está na lista.");
    return;
  }
  const div = document.getElementById("lista-jogadores");
  div.appendChild(criarLinhaJogador(nome));
  document.getElementById("novo-jogador").value = "";

  vincularEventosCheckbox();       // liga o listener só do jogador novo
  atualizarContadorSelecionados();
  atualizarTotalCadastrados();
  atualizarDicaDeRolagem();        // a lista cresceu: pode ter passado a rolar
}

// Data de HOJE no fuso do navegador, montada a partir dos componentes locais.
//
// Não usar toISOString(): ele converte para UTC, e no Brasil (UTC-3) qualquer
// horário depois das 21h já cai no dia seguinte — um dia de competição que
// termina tarde seria registrado com a data errada.
function dataDeHojeLocal() {
  const d = new Date();
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  return `${d.getFullYear()}-${mm}-${dd}`;
}

// Só preenche o que estiver vazio: nunca sobrescreve uma data já informada
// (inclusive num HTML reaberto pelo "Salvar este Dia").
function preencherDataPadrao() {
  const campo = document.getElementById("data");
  if (!campo || campo.value) return;
  campo.value = dataDeHojeLocal();
}

// ---------------------------------------------------------------------------
// Seletor de rodadas.
//
// Os <input type="radio"> são o controle real: a exclusividade vem do `name`
// compartilhado, e com eles vêm de graça o foco, a navegação por setas e a
// semântica de "opção escolhida". O #numRodadas continua sendo a única FONTE
// do valor — iniciarTorneio() lê exatamente o mesmo `.value` de sempre e não
// precisou mudar.
// ---------------------------------------------------------------------------
function radiosDeRodadas() {
  return document.querySelectorAll("#seletor-rodadas input[type=radio]");
}

function sincronizarRodadas() {
  const campo = document.getElementById("numRodadas");
  if (!campo) return;

  const marcados = document.querySelectorAll("#seletor-rodadas input[type=radio]:checked");
  // Sem escolha, o campo fica VAZIO — é assim que a validação de
  // iniciarTorneio() continua barrando o início do torneio.
  campo.value = marcados.length ? marcados[0].value : "";
}

function ligarSeletorDeRodadas() {
  const radios = radiosDeRodadas();
  if (!radios || !radios.length) return;

  Array.prototype.forEach.call(radios, r => {
    if (r.dataset && r.dataset.listener === "1") return;
    r.addEventListener("change", sincronizarRodadas);
    if (r.dataset) r.dataset.listener = "1";
  });

  sincronizarRodadas();   // deixa o campo coerente com a tela desde o início
}

carregarJogadores();
preencherDataPadrao();
ligarSeletorDeRodadas();





let jogadoresConfirmados = false;

function vincularEventosCheckbox() {
  const checks = document.querySelectorAll("#lista-jogadores input[type=checkbox]");
  checks.forEach(cb => {
    // evita duplicar listener
    if (cb.dataset.listener === "1") return;

    cb.addEventListener("change", () => {
      jogadoresConfirmados = false;
      document.getElementById("confirmacao-jogadores").style.display = "none";
      desabilitarIniciar();
      atualizarContadorSelecionados();
    });

    cb.dataset.listener = "1";
  });
}

function atualizarContadorSelecionados() {
  const checks = document.querySelectorAll("#lista-jogadores input[type=checkbox]:checked");
  document.getElementById("qtd-selecionados").textContent = checks.length;

  // Mesma regra de sempre para número ímpar (a paridade da seleção); o que muda
  // é só onde ela aparece — agora já na lista, e não só na confirmação.
  const aviso = document.getElementById("aviso-impar");
  if (!aviso) return;

  if (checks.length > 0 && checks.length % 2 !== 0) {
    aviso.className = "warn-inline on";
    aviso.innerHTML = "⚠ Número ímpar de participantes — haverá um Bye por rodada.";
  } else {
    aviso.className = "warn-inline";
    aviso.innerHTML = "";
  }
}

function abrirConfirmacaoJogadores() {
  const checks = document.querySelectorAll("#lista-jogadores input[type=checkbox]:checked");
  const selecionados = Array.from(checks).map(c => c.value);

  if (selecionados.length === 0) {
    alert("Selecione pelo menos 1 jogador antes de incluir.");
    return;
  }

  // monta a prévia
  // Ordena alfabeticamente
  selecionados.sort((a, b) => a.localeCompare(b, "pt-BR"));

const total = selecionados.length;

// Verifica se é ímpar
const avisoBye = total % 2 !== 0
  ? `<div class="callout callout--warn" style="margin-top:12px">
       <span>⚠</span>
       <span>Número ímpar — cada rodada terá um jogador com <strong>Bye</strong>.</span>
     </div>`
  : "";

const listaHtml = `
  <p class="confirm-count"><b>${total}</b> ${total === 1 ? "jogador" : "jogadores"}</p>
  ${avisoBye}
  <ul class="confirm-list">
    ${selecionados.map(n =>
      `<li class="confirm-item">${imgAvatar(n, "avatar-xs")}<span class="nome">${n}</span></li>`
    ).join("")}
  </ul>
`;

  document.getElementById("lista-confirmacao").innerHTML = listaHtml;
  document.getElementById("confirmacao-jogadores").style.display = "block";
}

function confirmarJogadores() {
  jogadoresConfirmados = true;
  habilitarIniciar();
  alert("Jogadores confirmados! Agora você pode iniciar o torneio.");
}

function refazerSelecao() {
  jogadoresConfirmados = false;
  document.getElementById("confirmacao-jogadores").style.display = "none";
  desabilitarIniciar();
}

function habilitarIniciar() {
  const btn = document.getElementById("btn-iniciar");
  btn.disabled = false;
  btn.style.opacity = "1";
  btn.style.cursor = "pointer";
}

function desabilitarIniciar() {
  const btn = document.getElementById("btn-iniciar");
  btn.disabled = true;
  btn.style.opacity = "0.5";
  btn.style.cursor = "not-allowed";
}









</script>
<script>
let jogadores = [];
let resultadosPorRodada = {};
let rodadaAtual = 0;
let totalRodadas = 0;
let confrontosAnteriores = new Set();
let ligaAtual = null;
let ultimaRodadaFinalizada = 0;   // só ela pode ser corrigida
let diaAtual = null;              // guardado para a exportação e o autosave

// Só para exibição no cabeçalho. NÃO entram no estado persistido — depois de um
// reload elas voltam vazias e o cabeçalho simplesmente omite a linha, em vez de
// mostrar um dado inventado.
let dataAtual = null;
let colecaoAtual = null;

// ---------------------------------------------------------------------------
// Helpers de APRESENTAÇÃO. Nenhum deles participa de regra do torneio: só
// resolvem foto, formatação e rótulo a partir de dados que já existem.
// ---------------------------------------------------------------------------

// Mesma convenção do ranking geral (main.js): minúsculas, sem acento e sem
// espaços. Uma regra só, para não existir um segundo cadastro de fotos.
function obterAvatarJogador(nome) {
  const base = String(nome || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/\s/g, "");
  return "img/avatar_" + base + ".jpg";
}

// O fallback vai no atributo `onerror` do próprio HTML: assim funciona também
// quando o markup é reconstruído por innerHTML, sem depender de listener.
function imgAvatar(nome, classe) {
  return `<img src="${obterAvatarJogador(nome)}" class="${classe || "avatar-sm"}" ` +
         `onerror="this.onerror=null;this.src='img/avatar_padrao.jpg';" ` +
         `alt="${escaparHtml(nome)}">`;
}

function escaparHtml(texto) {
  return String(texto === undefined || texto === null ? "" : texto)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

// "2026-08-25" -> "25/08/2026". Devolve o original se não reconhecer o formato.
function formatarDataISO(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ""));
  return m ? `${m[3]}/${m[2]}/${m[1]}` : (iso || "");
}

// "3 partidas + 1 Bye", contado a partir dos confrontos que já existem.
function resumoDaRodada(rodada) {
  const confrontos = resultadosPorRodada[rodada] || [];
  const byes = confrontos.filter(par => MTR.ehBye(par[1].nome)).length;
  const partidas = confrontos.length - byes;
  const texto = partidas === 1 ? "1 partida" : `${partidas} partidas`;
  return byes ? `${texto} + ${byes} Bye` : texto;
}

function cabecalhoRodada(rodada, complemento) {
  return '<div class="round-head">' +
         `<h2 class="round-title">Rodada ${rodada}${complemento || ""}</h2>` +
         `<span class="round-sub">${resumoDaRodada(rodada)}</span>` +
         '</div>';
}

function ladoDoConfronto(nome, direita) {
  return `<div class="match-side${direita ? " match-side--r" : ""}">` +
         imgAvatar(nome, "avatar-md") +
         `<span class="nome">${escaparHtml(nome)}</span></div>`;
}

// Símbolo do duelo, entre os dois placares. Só decoração — não entra em regra
// nenhuma, e não aparece no card de Bye, onde não há confronto.
function simboloVS() {
  return '<img class="vs-simbolo" src="img/Symbol-VS.png" alt="VS">';
}

// Confronto EDITÁVEL.
//
// A forma de 3 filhos [jogador1, placar, jogador2] com os inputs direto dentro
// do bloco do placar é obrigatória: finalizarRodada() e finalizarCorrecao()
// alcançam a linha por input.parentElement.parentElement e leem children[0..2].
// Era exatamente essa a semântica do <tr>/<td> que este card substitui.
function confrontoEditavel(rodada, slot, j1, j2, valores, sufixo) {
  const v = valores || ["", "", ""];
  const suf = sufixo || "";
  return `
    <div class="match" data-slot="${slot}">
      ${ladoDoConfronto(j1)}
      <div class="match-score">
        <input type="number" min="0" inputmode="numeric" id="r${rodada}_p${slot * 2}${suf}" value="${v[0]}">
        ${simboloVS()}
        <input type="number" min="0" inputmode="numeric" id="r${rodada}_p${slot * 2 + 1}${suf}" value="${v[1]}">
        ${campoEmpates(rodada, slot, v[2], suf)}
      </div>
      ${ladoDoConfronto(j2, true)}
    </div>`;
}

// Confronto já resolvido: mesmo card, com o placar como texto dos dois lados do
// VS. `placar` é o par devolvido por MTR.parsePlacar(), ou null quando não há
// resultado registrado.
function confrontoFinalizado(slot, j1, j2, placar, empates) {
  const centro = placar
    ? `<span class="final">${placar[0]}</span>` + simboloVS() +
      `<span class="final">${placar[1]}</span>`
    : '<span class="final">—</span>';

  return `
    <div class="match" data-slot="${slot}">
      ${ladoDoConfronto(j1)}
      <div class="match-score">${centro}` +
        (empates ? `<span class="emp-nota">${empates} game(s) empatado(s)</span>` : "") +
      `</div>
      ${ladoDoConfronto(j2, true)}
    </div>`;
}

function cartaoBye(nome, slot, passado) {
  return `
    <div class="bye-card" data-slot="${slot}">
      <span class="bye-icon">💤</span>
      <div>
        <div class="bye-label">Bye da rodada</div>
        <div class="nome">${escaparHtml(nome)}</div>
        <div class="bye-sub">${passado ? "folgou nesta rodada" : "não joga nesta rodada"}</div>
      </div>
      <span class="bye-mp">+3 MP</span>
    </div>`;
}

// ---------------------------------------------------------------------------
// Cabeçalho do torneio: liga, evento, situação e trilha das rodadas.
//
// Tudo derivado do estado que já existe — nenhum estado de negócio novo. Vive
// FORA de #torneio-area porque a área é zerada com innerHTML = "" ao iniciar e
// reescrita com innerHTML += pelo ranking.
// ---------------------------------------------------------------------------
function situacaoDoTorneio() {
  if (torneioEncerrado()) return { texto: "Torneio encerrado", classe: "th-status--done" };
  if (estadoRodadas[rodadaAtual] === "corrigindo") {
    return { texto: "Corrigindo placares", classe: "th-status--fix" };
  }
  return { texto: "Torneio em andamento", classe: "th-status--live" };
}

function trilhaDeRodadas() {
  if (!totalRodadas) return "";

  let html = '<div class="rail">';
  for (let n = 1; n <= totalRodadas; n++) {
    if (n > 1) {
      const feita = estadoRodadas[n - 1] === "finalizada";
      html += `<div class="rail-line${feita ? " rail-line--done" : ""}"></div>`;
    }

    let classe = "", marca = "○";
    if (estadoRodadas[n] === "finalizada") { classe = " rail-step--done"; marca = "✓"; }
    else if (estadoRodadas[n]) { classe = " rail-step--now"; marca = "●"; }

    html += `<div class="rail-step${classe}">` +
            `<div class="rail-dot">${marca}</div>` +
            `<div class="rail-num">${n}</div></div>`;
  }
  return html + "</div>";
}

function atualizarCabecalhoTorneio() {
  const painel = document.getElementById("torneio-header");
  const corpo = document.getElementById("th-corpo");
  if (!painel || !corpo) return;

  if (!jogadores.length || !totalRodadas) {
    painel.style.display = "none";
    corpo.innerHTML = "";
    return;
  }

  const s = situacaoDoTorneio();

  // Só entra o que a ferramenta REALMENTE tem. Depois de um reload, data e
  // coleção não existem mais (não são persistidas) e a linha some inteira.
  const evento = [colecaoAtual, formatarDataISO(dataAtual)]
    .filter(x => x)
    .map(escaparHtml)
    .join(" • ");

  painel.style.display = "block";
  corpo.innerHTML =
    '<div class="th-top"><div>' +
      `<div class="th-liga">Liga ${ligaAtual || "—"}</div>` +
      (evento ? `<div class="th-meta">${evento}</div>` : "") +
      `<div class="th-meta">${jogadores.length} ` +
        `${jogadores.length === 1 ? "jogador" : "jogadores"} • ` +
        `${totalRodadas} ${totalRodadas === 1 ? "rodada" : "rodadas"}</div>` +
    '</div>' +
    `<span class="th-status ${s.classe}">${s.texto}</span>` +
    '</div>' +
    trilhaDeRodadas();
}

// Situação de cada rodada, para a recuperação saber o que redesenhar:
//   "gerada"     -> pareada, aguardando os placares
//   "finalizada" -> concluída
//   "corrigindo" -> em correção de placares
let estadoRodadas = {};

// O que já foi digitado mas ainda não finalizado, para não se perder num reload.
//   rascunhos[n] = { placares: {slot: [p1, p2, empates]} }
let rascunhos = {};

function limparRascunho(rodada) {
  delete rascunhos[rodada];
}

// Na tela de correção os campos têm sufixo "_r"; nas demais, não.
// Sem isto o autosave lia os campos errados durante "Corrigir Placares" e o
// que fosse digitado ali se perdia num reload.
function sufixoCampos(rodada) {
  return estadoRodadas[rodada] === "corrigindo" ? "_r" : "";
}

// Slots que a rodada realmente tem, ignorando os de Bye (que não têm placar).
//
// Percorrer os slots CONHECIDOS, em vez de parar no primeiro input ausente, é
// o que corrige o caso de número ímpar: numa rodada automática o Bye ocupa o
// slot 0 e não tem inputs, então o laço antigo terminava de cara e nenhum
// placar da rodada era salvo.
function slotsDaRodada(rodada) {
  const confrontos = resultadosPorRodada[rodada];
  if (confrontos && confrontos.length) {
    return confrontos
      .filter(par => !MTR.ehBye(par[1].nome))
      .map((par, i) => (par.slot !== undefined ? par.slot : i));
  }

  return [];
}

// Lê o que está na tela da rodada em andamento e guarda no rascunho.
function capturarRascunho(rodada) {
  const r = rascunhos[rodada] || (rascunhos[rodada] = { placares: {} });
  const sufixo = sufixoCampos(rodada);

  slotsDaRodada(rodada).forEach(slot => {
    const p1 = document.getElementById(`r${rodada}_p${slot * 2}${sufixo}`);
    const p2 = document.getElementById(`r${rodada}_p${slot * 2 + 1}${sufixo}`);
    if (!p1 || !p2) return;               // Bye ou linha sem campos: só pula

    const e = document.getElementById(`r${rodada}_e${slot}${sufixo}`);
    if (p1.value !== "" || p2.value !== "") {
      r.placares[slot] = [p1.value, p2.value, e ? e.value : ""];
    } else {
      delete r.placares[slot];
    }
  });

  salvarEstado();
}

// Autosave por DELEGAÇÃO, instalado uma única vez no container do torneio.
//
// Antes cada campo recebia o seu próprio listener quando a rodada era
// desenhada. Isso é frágil: qualquer re-render (restauração, correção,
// redesenho) troca os elementos e os listeners antigos vão junto — bastava um
// caminho de renderização não chamar a função de ligar para a rodada inteira
// ficar sem autosave, silenciosamente.
//
// Com delegação em modo captura, o container escuta os eventos de qualquer
// campo, inclusive os criados depois. Não há debounce nem nada assíncrono:
// o volume de dados é ínfimo e a gravação precisa estar concluída antes de um
// ⌘R inesperado.
function instalarAutosave() {
  const area = document.getElementById("torneio-area");
  if (!area || !area.addEventListener || area._autosaveInstalado) return;
  area._autosaveInstalado = true;

  // Antes do autosave, de propósito: os dois escutam o mesmo container em modo
  // captura, e quem registra primeiro roda primeiro. Assim o rascunho já é
  // gravado com o valor corrigido do passo.
  instalarPassoDoPlacar();

  const aoMudar = (ev) => {
    const alvo = ev && ev.target;
    const id = alvo && alvo.id;
    if (!id) return;
    const m = /^r(\d+)_/.exec(id);
    if (!m) return;
    capturarRascunho(Number(m[1]));
  };

  area.addEventListener("input", aoMudar, true);
  area.addEventListener("change", aoMudar, true);
}

function ehCampoDePlacar(el) {
  return !!(el && el.id && /^r\d+_[pe]\d+(_r)?$/.test(el.id));
}

// Notifica o resto da página de que o campo mudou por nossa conta. No navegador
// dispara o evento de verdade, para o autosave rodar pelo mesmo caminho de
// sempre; sem a API de eventos, grava o rascunho direto.
function avisarMudanca(el) {
  try {
    if (typeof Event === "function" && el.dispatchEvent) {
      el.dispatchEvent(new Event("input", { bubbles: true }));
      return;
    }
  } catch (e) { /* segue para o caminho direto */ }

  const m = /^r(\d+)_/.exec(el.id || "");
  if (m) capturarRascunho(Number(m[1]));
}

// Primeiro passo do spinner num campo VAZIO.
//
// Pelo HTML, um <input type="number"> vazio vale 0 para efeito de passo, e a
// seta soma 1 em cima disso — o primeiro ↑ entrega 1 e o 0 fica inalcançável.
// Deixar os campos nascerem com value="0" resolveria a seta, mas destruiria a
// proteção que existe hoje: é o vazio que finalizarRodada() usa para saber que
// um placar ainda não foi informado e recusar a finalização.
//
// Então o vazio continua vazio e só o PASSO é corrigido:
//
//   vazio -> ↑ -> 0 -> ↑ -> 1 -> ↑ -> 2 ...
//
// Pelo teclado, as setas são tratadas aqui. Pelo mouse não há evento anterior
// ao passo, então o valor é fotografado antes da interação (pointerdown /
// mousedown / focusin) e o resultado é corrigido depois. Digitar nunca é
// corrigido: qualquer outra tecla marca o campo como digitação, e é por isso
// que teclar "1" num campo vazio continua valendo 1.
function instalarPassoDoPlacar() {
  const area = document.getElementById("torneio-area");
  if (!area || !area.addEventListener || area._passoInstalado) return;
  area._passoInstalado = true;

  const fotografar = (ev) => {
    const el = ev && ev.target;
    if (ehCampoDePlacar(el)) el._antesDoPasso = el.value;
  };
  ["pointerdown", "mousedown", "focusin"].forEach(tipo =>
    area.addEventListener(tipo, fotografar, true));

  area.addEventListener("keydown", (ev) => {
    const el = ev && ev.target;
    if (!ehCampoDePlacar(el)) return;

    if (ev.key === "ArrowUp" || ev.key === "ArrowDown") {
      if (el.value === "") {
        el.value = "0";
        el._antesDoPasso = "0";
        if (ev.preventDefault) ev.preventDefault();
        avisarMudanca(el);
        return;
      }
      el._antesDoPasso = el.value;
      return;
    }

    el._digitando = true;
    el._antesDoPasso = el.value;
  }, true);

  area.addEventListener("input", (ev) => {
    const el = ev && ev.target;
    if (!ehCampoDePlacar(el)) return;

    const digitou = el._digitando;
    el._digitando = false;

    if (!digitou && el._antesDoPasso === "" && el.value === "1") {
      el.value = "0";
    }
    el._antesDoPasso = el.value;
  }, true);
}

// Mantido para os pontos de renderização já existentes: garante o autosave
// instalado e grava o que estiver na tela naquele momento.
function ligarAutosave(rodada) {
  // NÃO capturar aqui. Capturar logo após renderizar é destrutivo: se a
  // reaplicação do rascunho falhar por qualquer motivo, os campos estão vazios
  // e capturarRascunho APAGA as entradas correspondentes — e salvarEstado()
  // persiste a perda. O rascunho só é reescrito quando o organizador digita.
  instalarAutosave();
}

// Última chance de gravar antes de a página sair. `pagehide` é o evento
// confiável no Safari (o iOS não dispara `beforeunload` de forma consistente).
function instalarFlushDeSaida() {
  if (typeof window === "undefined" || !window.addEventListener) return;
  const flush = () => {
    if (rodadaAtual) capturarRascunho(rodadaAtual);
    else salvarEstado();
  };
  window.addEventListener("pagehide", flush);
  window.addEventListener("beforeunload", flush);
}

// Indicador discreto: dá ao organizador — e ao teste no navegador — a
// confirmação de que o rascunho foi mesmo gravado.
function marcarRascunhoSalvo() {
  // Prefere o painel do torneio (fica no alto, sempre à vista); a área do
  // torneio é o alternativo quando o painel ainda não existe.
  const destino = document.getElementById("torneio-header") ||
                  document.getElementById("torneio-area");
  if (!destino || !document.createElement) return;

  let el = document.getElementById("aviso-rascunho");
  if (!el) {
    el = document.createElement("div");
    el.id = "aviso-rascunho";
    el.className = "save-badge";
    destino.appendChild(el);
  }
  const agora = new Date();
  const hh = String(agora.getHours()).padStart(2, "0");
  const mm = String(agora.getMinutes()).padStart(2, "0");
  const ss = String(agora.getSeconds()).padStart(2, "0");
  el.textContent = `✅ Rascunho salvo às ${hh}:${mm}:${ss}`;
}

// Reaplica na tela um rascunho restaurado do localStorage.
//
// `sufixoExplicito` vem de quem acabou de desenhar a tela e sabe quais campos
// criou. Depender só de estadoRodadas aqui tornava a reaplicação sensível à
// ordem em que o estado é atualizado durante a recuperação.
function aplicarRascunho(rodada, sufixoExplicito) {
  const r = rascunhos[rodada];
  if (!r) return;
  const sufixo = sufixoExplicito !== undefined ? sufixoExplicito : sufixoCampos(rodada);

  Object.keys(r.placares || {}).forEach(slot => {
    const v = r.placares[slot];
    const p1 = document.getElementById(`r${rodada}_p${Number(slot) * 2}${sufixo}`);
    const p2 = document.getElementById(`r${rodada}_p${Number(slot) * 2 + 1}${sufixo}`);
    const e = document.getElementById(`r${rodada}_e${slot}${sufixo}`);
    if (p1) p1.value = v[0];
    if (p2) p2.value = v[1];
    if (e && v[2]) e.value = v[2];
  });
}

// ---------------------------------------------------------------------------
// Helpers de estado (usados pela correção, pela recuperação e pelo autosave)
// ---------------------------------------------------------------------------


function acharJogador(nome) {
  return jogadores.find(j => j.nome === nome);
}



// ---------------------------------------------------------------------------
// Persistência: se o navegador fechar, atualizar ou travar no meio de um dia
// de jogos, o torneio é recuperado do localStorage.
// ---------------------------------------------------------------------------

const CHAVE_ESTADO = "ligaSupermarket:torneioEmAndamento";

// Versão do FORMATO do estado salvo.
//   1 — formato antigo, com o fluxo manual (estadoRodadas podia ser "manual",
//       e o rascunho tinha `pares`/`numLinhas`)
//   2 — formato atual, só geração automática
//
// Um estado de versão diferente é recusado em vez de restaurado pela metade:
// um torneio salvo na versão 1 com uma rodada "manual" cairia no ramo padrão
// da renderização e seria redesenhado como se estivesse finalizada.
const VERSAO_ESTADO = 2;

function temStorage() {
  try { return typeof localStorage !== "undefined"; } catch (e) { return false; }
}

// resultadosPorRodada guarda REFERÊNCIAS aos objetos de `jogadores`. Salvar
// direto duplicaria cada jogador e, ao restaurar, os pontos deixariam de
// acompanhar o histórico. Por isso os confrontos vão só como nomes + slot, e
// a restauração religa as referências pelo nome.
function serializarEstado() {
  const resultados = {};
  Object.keys(resultadosPorRodada).forEach(r => {
    resultados[r] = resultadosPorRodada[r].map(par => ({
      j1: par[0].nome,
      j2: par[1].nome,
      slot: par.slot
    }));
  });

  return {
    versao: VERSAO_ESTADO,
    salvoEm: new Date().toISOString(),
    ligaAtual: ligaAtual,
    diaAtual: diaAtual,
    rodadaAtual: rodadaAtual,
    totalRodadas: totalRodadas,
    ultimaRodadaFinalizada: ultimaRodadaFinalizada,
    estadoRodadas: estadoRodadas,
    rascunhos: rascunhos,
    jogadores: jogadores.map(j => ({
      nome: j.nome,
      pontos: j.pontos,
      saldo: j.saldo,
      historico: j.historico
    })),
    resultados: resultados,
    confrontosAnteriores: Array.from(confrontosAnteriores)
  };
}

function aplicarEstado(estado) {
  ligaAtual = estado.ligaAtual;
  diaAtual = estado.diaAtual;
  rodadaAtual = estado.rodadaAtual;
  totalRodadas = estado.totalRodadas;
  ultimaRodadaFinalizada = estado.ultimaRodadaFinalizada || 0;
  estadoRodadas = estado.estadoRodadas || {};
  rascunhos = estado.rascunhos || {};

  jogadores = (estado.jogadores || []).map(j => ({
    nome: j.nome,
    pontos: j.pontos || 0,
    saldo: j.saldo || 0,
    historico: j.historico || []
  }));

  confrontosAnteriores = new Set(estado.confrontosAnteriores || []);

  // Religa as referências: cada confronto volta a apontar para o MESMO objeto
  // que está em `jogadores`, não para uma cópia.
  resultadosPorRodada = {};
  Object.keys(estado.resultados || {}).forEach(r => {
    resultadosPorRodada[r] = estado.resultados[r].map(p => {
      const par = [
        MTR.ehBye(p.j1) ? { nome: "Bye" } : acharJogador(p.j1),
        MTR.ehBye(p.j2) ? { nome: "Bye" } : acharJogador(p.j2)
      ];
      par.slot = p.slot;
      return par;
    });
  });
}

let avisouFalhaStorage = false;

// Se a gravação falhar, o organizador precisa SABER que não há recuperação —
// senão ele confia num autosave que não existe. O aviso aparece uma única vez
// por sessão e o torneio segue funcionando normalmente.
function avisarFalhaStorage(erro) {
  console.warn("Não foi possível salvar o torneio:", erro);
  if (avisouFalhaStorage) return;
  avisouFalhaStorage = true;

  const msg = "⚠️ Não foi possível ativar a recuperação automática deste torneio. " +
              "Evite atualizar ou fechar esta página.";

  const area = document.getElementById("torneio-area");
  if (area && area.appendChild && document.createElement) {
    const aviso = document.createElement("div");
    aviso.id = "aviso-storage";
    aviso.className = "callout callout--warn";
    aviso.style.cssText = "margin:14px 0";
    aviso.textContent = msg;
    area.appendChild(aviso);
  }
  if (typeof alert === "function") alert(msg);
}

function salvarEstado() {
  if (!jogadores.length) return;
  if (!temStorage()) { avisarFalhaStorage(new Error("localStorage indisponível")); return; }
  try {
    localStorage.setItem(CHAVE_ESTADO, JSON.stringify(serializarEstado()));
    marcarRascunhoSalvo();
  } catch (e) {
    avisarFalhaStorage(e);
  }
}

// Devolve o estado salvo apenas se ele for do formato ATUAL. Um estado de
// outra versão não é restaurado pela metade — é recusado e descartado, com
// aviso, porque restaurar parcialmente é pior do que começar de novo.
function lerEstadoSalvo() {
  if (!temStorage()) return null;
  try {
    const bruto = localStorage.getItem(CHAVE_ESTADO);
    if (!bruto) return null;

    const estado = JSON.parse(bruto);
    if (!estado || !estado.jogadores || !estado.jogadores.length) return null;

    if (Number(estado.versao) !== VERSAO_ESTADO) {
      avisarEstadoIncompativel(estado.versao);
      apagarEstadoSalvo();
      return null;
    }

    return estado;
  } catch (e) {
    return null;
  }
}

function avisarEstadoIncompativel(versao) {
  alert(
    "Havia um torneio salvo em um formato antigo (versão " + (versao || "?") + "), " +
    "de uma versão anterior desta ferramenta.\n\n" +
    "Ele não pode ser recuperado com segurança e foi descartado. " +
    "Comece um novo torneio."
  );
}

function apagarEstadoSalvo() {
  if (!temStorage()) return;
  try { localStorage.removeItem(CHAVE_ESTADO); } catch (e) {}
}

// ---------------------------------------------------------------------------
// Diálogo próprio da página, no lugar do confirm() nativo — que aparecia como
// "Cancelar / OK" e não dizia o que cada botão faria.
//
// Isto NÃO decide nada: são as mesmas perguntas, nas mesmas condições, chamando
// as mesmas funções. Só muda quem desenha a caixa.
// ---------------------------------------------------------------------------
function fecharDialogo() {
  const caixa = document.getElementById("modal-torneio");
  if (caixa) caixa.className = "";
}

function abrirDialogo(op) {
  const caixa = document.getElementById("modal-torneio");
  const titulo = document.getElementById("modal-titulo");
  const meta = document.getElementById("modal-meta");
  const texto = document.getElementById("modal-texto");
  const btnNao = document.getElementById("modal-nao");
  const btnSim = document.getElementById("modal-sim");

  const responder = (sim) => {
    fecharDialogo();
    const acao = sim ? op.aoSim : op.aoNao;
    if (acao) acao();
  };

  // Página sem a marcação do diálogo — por exemplo um HTML gerado por
  // "Salvar este Dia" numa versão anterior. Perguntar de outro jeito é melhor
  // do que decidir pelo organizador.
  if (!caixa || !titulo || !meta || !texto || !btnNao || !btnSim) {
    const pergunta = op.titulo + (op.meta ? "\n" + op.meta : "") +
                     (op.texto ? "\n\n" + op.texto : "");
    responder(typeof confirm === "function" && confirm(pergunta));
    return;
  }

  titulo.textContent = op.titulo;
  meta.textContent = op.meta || "";
  meta.style.display = op.meta ? "block" : "none";
  texto.textContent = op.texto || "";
  btnNao.textContent = op.rotuloNao;
  btnSim.textContent = op.rotuloSim;
  btnNao.onclick = () => responder(false);
  btnSim.onclick = () => responder(true);
  caixa.className = "aberto";
}

// Segunda confirmação do descarte. É a mesma pergunta nos dois caminhos que
// apagam o torneio salvo, então mora numa função só.
function confirmarDescarteDoTorneio(aoApagar) {
  abrirDialogo({
    titulo: "Apagar torneio salvo?",
    texto: "Esta ação não poderá ser desfeita.",
    rotuloNao: "NÃO",
    rotuloSim: "SIM, APAGAR",
    aoSim: aoApagar
  });
}

function descartarTorneioSalvo() {
  confirmarDescarteDoTorneio(() => {
    apagarEstadoSalvo();
    location.reload();
  });
}

// Redesenha cada rodada CONFORME O SEU ESTADO. Antes tudo que estivesse em
// resultadosPorRodada virava tabela de leitura, então uma rodada gerada e ainda
// não finalizada aparecia como histórica, em vez de voltar editável.
function redesenharRodadas() {
  const area = document.getElementById("torneio-area");
  if (!area) return;
  area.style.display = "block";

  const rodadas = new Set(
    Object.keys(resultadosPorRodada).map(Number)
      .concat(Object.keys(estadoRodadas).map(Number))
  );

  Array.from(rodadas).sort((a, b) => a - b).forEach(r => {
    const situacao = estadoRodadas[r] || "finalizada";

    if (situacao === "gerada") { redesenharRodadaEditavel(r); return; }
    if (situacao === "corrigindo") { corrigirPlacares(r, true); return; }

    redesenharRodadaLeitura(r);
  });
}

function redesenharRodadaLeitura(r) {
  const area = document.getElementById("torneio-area");
  const bloco = document.createElement("div");
  // Rodadas já passadas ficam visualmente discretas: o foco da página é a atual.
  bloco.className = "rodada-bloco" +
                    (Number(r) < Number(rodadaAtual) ? " round--past" : "");
  bloco.id = "rodada_" + r;

  let html = cabecalhoRodada(r) + '<div class="matches">';

  (resultadosPorRodada[r] || []).forEach((par, i) => {
    const slot = par.slot !== undefined ? par.slot : i;
    if (MTR.ehBye(par[1].nome)) {
      html += cartaoBye(par[0].nome, slot, true);
      return;
    }
    const h = (par[0].historico || []).find(
      x => x.contra === par[1].nome && Number(x.rodada) === Number(r)
    );
    const p = h ? MTR.parsePlacar(h.placar) : null;
    html += confrontoFinalizado(slot, par[0].nome, par[1].nome, p,
                                h && h.gamesEmpatados);
  });

  html += "</div>";
  bloco.innerHTML = html;
  area.appendChild(bloco);
}

// Rodada automática pareada mas ainda sem placares: volta EDITÁVEL, com os
// mesmos confrontos e o que já tinha sido digitado.
function redesenharRodadaEditavel(r) {
  const area = document.getElementById("torneio-area");
  const bloco = document.createElement("div");
  bloco.className = "rodada-bloco";
  bloco.id = "rodada_" + r;

  let html = cabecalhoRodada(r) + '<div class="matches">';

  // Mesma ideia da tela de correção: o que já foi digitado vai no atributo
  // `value` do HTML, sem depender de uma reaplicação posterior.
  const valores = (rascunhos[r] && rascunhos[r].placares) || {};

  (resultadosPorRodada[r] || []).forEach((par, i) => {
    const slot = par.slot !== undefined ? par.slot : i;
    if (MTR.ehBye(par[1].nome)) {
      html += cartaoBye(par[0].nome, slot);
      return;
    }
    html += confrontoEditavel(r, slot, par[0].nome, par[1].nome, valores[slot], "");
  });

  html += "</div>";
  html += blocoEmpatesToggle(r);
  html += '<div class="round-actions">' +
          `<button class="btn-primary" onclick="finalizarRodada(${r})">` +
          `Finalizar Rodada ${r}</button></div>`;
  bloco.innerHTML = html;
  area.appendChild(bloco);

  aplicarRascunho(r, "");
  ligarAutosave(r);
}


// Regra de domínio: nenhuma nova rodada enquanto a atual estiver em "gerada"
// ou "corrigindo". Vale também para chamada direta pelo console — a ausência
// do botão na tela não é garantia suficiente.
function podeGerarNovaRodada() {
  if (rodadaAtualEstaFinalizada()) return true;
  const situacao = estadoRodadas[rodadaAtual];
  const motivo = situacao === "corrigindo"
    ? `A Rodada ${rodadaAtual} está em correção de placares.`
    : `A Rodada ${rodadaAtual} ainda não foi finalizada.`;
  alert(`${motivo}\n\nFinalize a rodada atual antes de gerar a próxima.`);
  return false;
}

function rodadaAtualEstaFinalizada() {
  if (rodadaAtual === 0) return true;   // nenhuma rodada gerada ainda
  return (estadoRodadas[rodadaAtual] || "finalizada") === "finalizada";
}

function retomarTorneioSalvo(estado) {
  aplicarEstado(estado);
  instalarAutosave();
  instalarFlushDeSaida();
  redesenharRodadas();
  mostrarRanking();
  mostrarEstatisticasAppendixC();

  // A última rodada finalizada continua corrigível depois de um reload, e um
  // torneio já encerrado continua exportável.
  atualizarCabecalhoTorneio();
  atualizarBotaoCorrigir();
  atualizarBotaoExportar();

  const area = document.getElementById("torneio-area");

  // A próxima rodada só é oferecida se a atual estiver de fato finalizada —
  // antes o botão aparecia mesmo com a rodada em andamento, e gerar a seguinte
  // pularia a atual em silêncio.
  if (rodadaAtualEstaFinalizada() && rodadaAtual < totalRodadas) {
    const botaoAuto = document.createElement("button");
    botaoAuto.id = "btn-proxima-auto";
    botaoAuto.textContent = "Gerar Próxima Rodada →";

  const btnDescartar = document.createElement("button");
  btnDescartar.className = "btn-danger";
  btnDescartar.textContent = "Apagar torneio salvo / iniciar novo";
  btnDescartar.onclick = descartarTorneioSalvo;
  area.appendChild(btnDescartar);
}

function verificarTorneioSalvo() {
  const estado = lerEstadoSalvo();
  if (!estado) return;

  const quando = estado.salvoEm
    ? " · salvo em " + new Date(estado.salvoEm).toLocaleString("pt-BR")
    : "";

  // Mesma decisão de sempre: continuar retoma; recusar leva à segunda pergunta;

    meta: `Liga ${estado.ligaAtual} · Rodada ${estado.rodadaAtual} de ` +

    rotuloNao: "NÃO, COMEÇAR NOVO",

    aoSim: () => retomarTorneioSalvo(estado),

if (typeof window !== "undefined") {

// Converte o histórico dos jogadores para o formato de jogos que o mtr.js lê.
// É a partir daqui que TODOS os números da ferramenta são calculados — não há
// mais uma segunda implementação dos percentuais nesta página.
function historicoParaJogos(listaJogadores) {
  const jogos = [];
  const vistos = {};

  listaJogadores.forEach(j => {
    j.historico.forEach(h => {
      if (MTR.ehBye(h.contra)) {
        jogos.push({ jogador1: j.nome, resultado: "2 x 0", jogador2: "Bye" });
        return;
      }
      // Cada partida aparece no histórico dos dois jogadores; registra uma vez.
      const id = (h.rodada || 0) + "#" + [j.nome, h.contra].sort().join("|");
      if (vistos[id]) return;
      vistos[id] = true;

      const p = MTR.parsePlacar(h.placar);
      if (!p) return;
      jogos.push({
        jogador1: j.nome,
        resultado: p[0] + " x " + p[1],
        jogador2: h.contra,
        gamesEmpatados: h.gamesEmpatados || 0
      });
    });
  });

  return jogos;
}

// Ordenação oficial (MTR Appendix C): MP -> OMW% -> GW% -> OGW%.
// Empates reais são desfeitos por sorteio, com embaralhamento uniforme.
function ordenarJogadoresSuico(jogadores) {
  const registros = MTR.construirRegistros(historicoParaJogos(jogadores));

  const stats = jogadores.map(j => {
    const r = registros[j.nome] || MTR.novoRegistro();
    return {
      ...j,
      matchPoints: r.matchPoints,
      matchWinPerc: MTR.matchWinPctRaw(r),
      gameWinPerc: MTR.gameWinPctRaw(r),
      omwp: MTR.opponentsMatchWinPct(r, registros),
      ogwp: MTR.opponentsGameWinPct(r, registros)
    };
  });

  // Embaralha antes de ordenar: como o sort do JS é estável e compararCriterios
  // devolve 0 no empate real, quem empatar nos quatro critérios fica em ordem
  // sorteada, e não sempre na mesma.
  //
  // Usa o comparador do mtr.js — que aplica o piso de 33% ao GW%. Uma ordenação
  // própria aqui deixava o piso de fora e alterava tanto a ordem do pareamento
  // quanto quem recebia o BYE (escolherBye lê esta lista de trás para frente).
  Pareamento.embaralhar(stats);
  stats.sort((a, b) => MTR.compararCriterios(
    { matchPoints: a.matchPoints, omwp: a.omwp, gameWinPerc: a.gameWinPerc, ogwp: a.ogwp },
    { matchPoints: b.matchPoints, omwp: b.omwp, gameWinPerc: b.gameWinPerc, ogwp: b.ogwp }
  ));

  return stats;
}


function gerarRodada() {
  if (!podeGerarNovaRodada()) return;
  removerBotaoReabrirAnterior();
  rodadaAtual++;
  // Garantir que pontos e saldo estejam sempre consistentes com o histórico
  jogadores.forEach(j => {
  let pontos = 0;
  let saldo = 0;

  j.historico.forEach(h => {
    const placar = h.placar.replace("(bye)", "").trim();
    if (!placar.includes("x")) return;

    const [g1, g2] = placar.split("x").map(Number);
    if (isNaN(g1) || isNaN(g2)) return;

    if (g1 > g2) pontos += 3;
    else if (g1 === g2) pontos += 1;

    saldo += g1 - g2;
  });

  j.pontos = pontos;
  j.saldo = saldo;
  });




  const area = document.getElementById("torneio-area");

  const bloco = document.createElement("div");
  bloco.className = "rodada-bloco";
  bloco.id = "rodada_" + rodadaAtual;
  // O cabeçalho só é montado no fim: ele resume os confrontos, que ainda não
  // existem neste ponto.
  let avisoRepeticoes = "";

  let jogadoresOrdenados;

if (rodadaAtual === 1) {
  // Primeira rodada: ninguém tem histórico, então a ordem é sorteada.
  jogadoresOrdenados = Pareamento.embaralhar(
    [...jogadores].filter(j => !MTR.ehBye(j.nome))
  );
} else {
  // Demais rodadas: ordenação oficial do Appendix C
  jogadoresOrdenados = ordenarJogadoresSuico(jogadores.filter(j => !MTR.ehBye(j.nome)));
}

  // Pareamento suíço com faixas de pontuação e backtracking (pareamento.js).
  // Só repete um confronto quando é matematicamente inevitável — e avisa.
  const porNome = {};
  jogadores.forEach(j => { porNome[j.nome] = j; });

  const nomesOrdenados = jogadoresOrdenados.map(j => j.nome);

  const resultado = Pareamento.gerarRodada(
    nomesOrdenados,
    (a, b) => confrontosAnteriores.has(a + "|" + b),
    (nome) => (porNome[nome].historico || []).some(h => MTR.ehBye(h.contra))
  );

  const confrontos = [];

  if (resultado.bye) {
    // O BYE só define QUEM folga. Pontos e histórico entram na finalização,
    // junto com os placares — antes eram aplicados aqui, e a classificação
    // já mudava com a rodada ainda em andamento.
    confrontos.push([porNome[resultado.bye], { nome: "Bye" }]);
  }

  resultado.pares.forEach(par => {
    const j1 = porNome[par[0]];
    const j2 = porNome[par[1]];
    confrontos.push([j1, j2]);
    confrontosAnteriores.add(j1.nome + "|" + j2.nome);
    confrontosAnteriores.add(j2.nome + "|" + j1.nome);
  });

  if (resultado.repeticoesForcadas.length) {
    const lista = resultado.repeticoesForcadas
      .map(p => p[0] + " x " + p[1]).join("\n  ");
    avisoRepeticoes =
      '<div class="callout callout--warn" style="margin-bottom:16px"><span>⚠️</span><span>' +
      "Não existe pareamento sem repetição nesta rodada. " +
      "Estes confrontos já aconteceram e se repetem:<br><b>" +
      resultado.repeticoesForcadas.map(p => p[0] + " × " + p[1]).join("<br>") +
      "</b></span></div>";
    console.warn("Repetições inevitáveis na rodada " + rodadaAtual + ":\n  " + lista);
  }

  resultadosPorRodada[rodadaAtual] = confrontos;
  estadoRodadas[rodadaAtual] = "gerada";

  // `slot` é o índice da posição do confronto na rodada, gravado no próprio
  // confronto. Ler o placar por ele, e não pela posição no array, é o que impede
  // que os placares sejam atribuídos ao jogo errado quando há Bye.
  let html = '<div class="matches">';
  confrontos.forEach((par, i) => {
    par.slot = i;
    if (par[1].nome === "Bye") {
      html += cartaoBye(par[0].nome, i);
    } else {
      html += confrontoEditavel(rodadaAtual, i, par[0].nome, par[1].nome, null, "");
    }
  });

  html += '</div>';
  html += blocoEmpatesToggle(rodadaAtual);
  html += '<div class="round-actions">' +
          `<button class="btn-primary" onclick="finalizarRodada(${rodadaAtual})">` +
          `Finalizar Rodada ${rodadaAtual}</button></div>`;
  bloco.innerHTML = cabecalhoRodada(rodadaAtual) + avisoRepeticoes + html;
  area.appendChild(bloco);
  ligarAutosave(rodadaAtual);
  atualizarCabecalhoTorneio();
  salvarEstado();
}

// Checkbox que revela os campos de empate de game. Fica desmarcado por padrão:
// game empatado é raro e não deve poluir o fluxo normal.
function blocoEmpatesToggle(rodada) {
  return `<label class="emp-toggle">
    <input type="checkbox" id="tog-emp-${rodada}" onchange="alternarEmpates(${rodada})">
    Registrar empates de game (raro)
  </label>`;
}

function alternarEmpates(rodada) {
  const tog = document.getElementById("tog-emp-" + rodada);
  const bloco = document.getElementById("rodada_" + rodada) ||
                document.getElementById("rodada_" + rodada + "_reaberta");
  if (!tog || !bloco) return;
  bloco.querySelectorAll(".emp-wrap").forEach(el => {

  });
