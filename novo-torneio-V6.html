// Campo de empates embutido no próprio bloco do placar — assim o confronto
// continua com 3 filhos e o código que lê children[0..2] segue válido.
function campoEmpates(rodada, slot, valor, sufixo) {
  return `<span class="emp-wrap" style="display:none">Games empatados` +
    `<input type="number" min="0" id="r${rodada}_e${slot}${sufixo || ""}" value="${valor || ""}"></span>`;
}


// Assim que uma nova rodada e gerada, a anterior deixa de poder ser reaberta:
// tiramos o botao para a interface nao oferecer o que sera recusado.
function removerBotaoReabrirAnterior() {
  const btn = document.getElementById("btn-reabrir-" + rodadaAtual);
  if (btn) btn.remove();
}


// ---------------------------------------------------------------------------




function finalizarRodada(rodada) {
  let confrontos = resultadosPorRodada[rodada];

  // Placares também em duas fases: lê e valida TODOS antes de aplicar
  // qualquer um, para um placar em branco na última linha não deixar as
  // primeiras já gravadas.
  const placares = [];

  for (let i = 0; i < confrontos.length; i++) {
    const j1 = confrontos[i][0];
    const j2 = confrontos[i][1];

    // Lê pelo `slot` (a linha real na tabela), não pela posição no array.
    // Com o Bye ocupando um slot sem campos, slot e posição no array divergem.
    const slot = (confrontos[i].slot !== undefined) ? confrontos[i].slot : i;
    const input1 = document.getElementById(`r${rodada}_p${slot * 2}`);
    const input2 = document.getElementById(`r${rodada}_p${slot * 2 + 1}`);

    // A linha do Bye não tem campos de placar. Ela entra na lista para o BYE
    // ser aplicado junto com o resto, na fase de aplicação.
    if (MTR.ehBye(j2.nome)) { placares.push({ i, slot, bye: true }); continue; }
    if (!input1 || !input2) continue;

    const p1 = parseInt(input1.value);
    const p2 = parseInt(input2.value);

    if (isNaN(p1) || isNaN(p2)) {
      alert(`Preencha todos os placares antes de finalizar (falta ${j1.nome} x ${j2.nome}).`);
      return;   // nada aplicado
    }

    // Games empatados: campo opcional, só existe se a coluna estiver ativa.
    const inputE = document.getElementById(`r${rodada}_e${slot}`);
    const emp = inputE && inputE.value !== "" ? parseInt(inputE.value) : 0;
    if (isNaN(emp) || emp < 0) {
      alert(`Empates de game inválidos em ${j1.nome} x ${j2.nome}.`);
      return;
    }

    placares.push({ i, slot, p1, p2, emp: emp || 0 });
  }

  // Tudo válido: aplica.
  placares.forEach(reg => {
    const j1 = confrontos[reg.i][0];
    const j2 = confrontos[reg.i][1];
    const input1 = document.getElementById(`r${rodada}_p${reg.slot * 2}`);
    const tr = input1 && input1.parentElement ? input1.parentElement.parentElement : null;
    const tdJog1 = tr ? tr.children[0] : null;
    const tdPlacar = tr ? tr.children[1] : null;
    const tdJog2 = tr ? tr.children[2] : null;

    if (reg.bye) {
      // O BYE é aplicado AGORA, não na geração da rodada. A guarda impede
      // duplicar se a finalização for acionada duas vezes.
      const jaAplicado = (j1.historico || []).some(
        h => MTR.ehBye(h.contra) && Number(h.rodada) === Number(rodada)
      );
      if (!jaAplicado) {
        j1.pontos += 3;
        j1.saldo += 2;
        j1.historico.push({ contra: "Bye", placar: "2x0 (bye)", rodada: rodada });
      }

      if (tdJog1 && tdJog2 && tdPlacar) {
        tdJog1.textContent = j1.nome;
        tdPlacar.innerHTML = "<span>2 x 0</span>";
        tdJog2.textContent = "Bye";
      }
      return;
    }

    const { p1, p2, emp } = reg;

    if (tdJog1 && tdJog2 && tdPlacar) {
      tdJog1.textContent = j1.nome;
      tdPlacar.innerHTML = `<span>${p1} x ${p2}${emp ? ` (${emp} emp.)` : ""}</span>`;
      tdJog2.textContent = j2.nome;
    }

    if (p1 > p2) j1.pontos += 3;
    else if (p2 > p1) j2.pontos += 3;
    else { j1.pontos += 1; j2.pontos += 1; }

    j1.saldo += p1 - p2;
    j2.saldo += p2 - p1;

    j1.historico.push({ contra: j2.nome, placar: `${p1}x${p2}`, rodada: rodada, gamesEmpatados: emp });
    j2.historico.push({ contra: j1.nome, placar: `${p2}x${p1}`, rodada: rodada, gamesEmpatados: emp });
  });

  estadoRodadas[rodada] = "finalizada";

  // Tira a interface de correcao e deixa uma unica tabela da rodada, ja com os
  // novos resultados.
  removerBlocosDaRodada(rodada);
  redesenharRodadaLeitura(rodada);
  ultimaRodadaFinalizada = Math.max(ultimaRodadaFinalizada, rodada);
  limparRascunho(rodada);
  salvarEstado();

  mostrarRanking();
  mostrarEstatisticasAppendixC();
  botoesProximaRodada(rodada);
}

// Só é chamada depois de uma rodada ser efetivamente finalizada — é isso que
// impede a próxima rodada de ser oferecida com a atual ainda em andamento.
// "Corrigir Placares" só existe depois de a rodada estar finalizada — antes
// disso não há placar para corrigir, basta preencher os campos.
function adicionarBotaoCorrigir(rodada) {
  const bloco = document.getElementById("rodada_" + rodada);
  if (!bloco || !document.createElement) return;
  if (document.getElementById("btn-reabrir-" + rodada)) return;

  const btn = document.createElement("button");
  btn.id = "btn-reabrir-" + rodada;
  btn.textContent = "Corrigir Placares";
  btn.onclick = () => corrigirPlacares(rodada);
  bloco.appendChild(btn);
}

// Regra única de onde o botão pode aparecer, aplicada tanto no fluxo normal
// quanto na retomada de um torneio salvo:
//
//   a rodada atual está finalizada  E  é a última finalizada
//   (se uma rodada posterior tivesse sido gerada, rodadaAtual já teria
//    avançado além de ultimaRodadaFinalizada)
//
// Antes o botão era criado só em botoesProximaRodada(), por onde a retomada
// não passa — então ele sumia depois de um reload.
function atualizarBotaoCorrigir() {
  // Tira o botão de qualquer rodada anterior
  Object.keys(estadoRodadas).forEach(r => {
    if (Number(r) === Number(rodadaAtual)) return;
    const b = document.getElementById("btn-reabrir-" + r);
    if (b && b.remove) b.remove();
  });

  const podeCorrigir =
    estadoRodadas[rodadaAtual] === "finalizada" &&
    Number(rodadaAtual) === Number(ultimaRodadaFinalizada);

  if (podeCorrigir) {
    adicionarBotaoCorrigir(rodadaAtual);
  } else {
    const b = document.getElementById("btn-reabrir-" + rodadaAtual);
    if (b && b.remove) b.remove();
  }
}

function botoesProximaRodada(rodada) {
  const area = document.getElementById("torneio-area");
  if (!area) return;
  atualizarCabecalhoTorneio();
  atualizarBotaoCorrigir();
  atualizarBotaoExportar();

  const oldAuto = document.getElementById("btn-proxima-auto");
  if (oldAuto) oldAuto.remove();

  if (rodada < totalRodadas) {
    const botaoAuto = document.createElement("button");
    botaoAuto.id = "btn-proxima-auto";
    botaoAuto.textContent = "Gerar Próxima Rodada →";
    botaoAuto.onclick = gerarRodada;
    area.appendChild(botaoAuto);
  }
}



function mostrarRanking() {
  const area = document.getElementById("torneio-area");
  const existente = document.getElementById("ranking-atual");
  if (existente) existente.remove();

  // Durante a correção a rodada está desfeita pela metade: os jogos normais
  // saíram do histórico e o BYE (que não é editável) permaneceu. Qualquer
  // classificação aqui seria um estado intermediário — no teste real aparecia
  // só o jogador do BYE, com 3 pontos. Volta ao salvar a correção.
  if (estadoRodadas[rodadaAtual] === "corrigindo") return;

  // Mesma ordenação da tabela Appendix C: antes esta tabela ordenava por
  // pontos + saldo e podia apontar um campeão diferente do que aparecia
  // logo abaixo.
  //
  // A classificação sai do histórico, e o histórico só recebe uma rodada
  // quando ela é FINALIZADA — então nada de uma rodada em andamento entra
  // aqui. Com nenhuma rodada finalizada, não há classificação a mostrar.
  const ranking = MTR.classificar(
    historicoParaJogos(jogadores.filter(j => !MTR.ehBye(j.nome)))
  );

  if (!ranking.length) return;

  let html = "<div class='ranking' id='ranking-atual'><h3>Ranking Atual</h3>" +
             '<div class="table-scroll"><table><thead><tr>' +
             '<th>#</th><th>Jogador</th><th class="num">MP</th><th class="num">V-D-E</th>' +
             "</tr></thead><tbody>";

  const medalhas = ["🥇", "🥈", "🥉"];
  ranking.forEach((j, i) => {
    const medalha = medalhas[i] ? `${medalhas[i]} ` : "";
    html += "<tr>" +
      `<td class="rank-pos">${medalha}${i + 1}</td>` +
      `<td><span class="rank-player">${imgAvatar(j.jogador, "avatar-xs")}` +
      `<span class="nome">${escaparHtml(j.jogador)}</span></span></td>` +
      `<td class="num rank-mp">${j.matchPoints}</td>` +
      `<td class="num">${j.vitorias}-${j.derrotas}-${j.empates}</td></tr>`;
  });
  html += "</tbody></table></div></div>";
  area.innerHTML += html;
}






// Corrige os PLACARES da rodada atual. Os confrontos permanecem os mesmos —
// esta função nunca refaz um pareamento.
// `restaurando` = true quando chamada pela recuperação do localStorage, para
// redesenhar a tela sem revalidar nem alertar.
function corrigirPlacares(rodada, restaurando) {
  const confrontos = resultadosPorRodada[rodada];

  if (!confrontos || !confrontos.length) {
    if (!restaurando) alert("Esta rodada ainda não foi finalizada.");
    return;
  }

  // A regra vale no DOMÍNIO, não só na interface: além de ser a última rodada
  // finalizada, nenhuma rodada posterior pode ter sido gerada. Sem a segunda
  // condição, chamar a função direto pelo console corrigiria uma rodada que já
  // serviu de base para o pareamento seguinte.
  if (!restaurando &&
      (Number(rodada) !== Number(ultimaRodadaFinalizada) ||
       Number(rodada) !== Number(rodadaAtual))) {
    alert(
      `Só é possível corrigir os placares da rodada atual (Rodada ${rodadaAtual}), ` +
      `e apenas enquanto nenhuma rodada posterior tiver sido gerada.\n\n` +
      `A Rodada ${rodada} já foi usada para montar os pareamentos das rodadas seguintes; ` +
      `mudar o resultado dela agora tornaria esses pareamentos inconsistentes.`
    );
    return;
  }

  // Guarda o placar que está valendo ANTES do rollback, para pré-preencher os
  // campos de correção — depois daqui o histórico da rodada já não existe.
  const placarAtual = {};
  confrontos.forEach((par, i) => {
    if (MTR.ehBye(par[1].nome)) return;
    const slot = par.slot !== undefined ? par.slot : i;
    const h = (par[0].historico || []).find(
      x => x.contra === par[1].nome && Number(x.rodada) === Number(rodada)
    );
    const p = h ? MTR.parsePlacar(h.placar) : null;
    if (p) placarAtual[slot] = [String(p[0]), String(p[1]), h.gamesEmpatados ? String(h.gamesEmpatados) : ""];
  });

  // Remove pontos, saldo e histórico APENAS desta rodada.
  // Antes o filtro era por adversário, então reabrir uma rodada apagava também
  // as partidas contra o mesmo adversário em outras rodadas.
  confrontos.forEach((par) => {
    if (MTR.ehBye(par[1].nome)) return;
    const j1 = jogadores.find(j => j.nome === par[0].nome);
    const j2 = jogadores.find(j => j.nome === par[1].nome);
    if (!j1 || !j2) return;

    const daRodada = h => h.contra === j2.nome && Number(h.rodada) === Number(rodada);
    const resultado = j1.historico.find(daRodada);
    if (!resultado) return;

    const p = MTR.parsePlacar(resultado.placar);
    if (!p) return;
    const [g1, g2] = p;

    if (g1 > g2) j1.pontos -= 3;
    else if (g2 > g1) j2.pontos -= 3;
    else {
      j1.pontos -= 1;
      j2.pontos -= 1;
    }
    j1.saldo -= g1 - g2;
    j2.saldo -= g2 - g1;

    // Remove só a entrada desta rodada
    j1.historico = j1.historico.filter(h => !(h.contra === j2.nome && Number(h.rodada) === Number(rodada)));
    j2.historico = j2.historico.filter(h => !(h.contra === j1.nome && Number(h.rodada) === Number(rodada)));
  });

  estadoRodadas[rodada] = "corrigindo";

  // Enquanto a rodada está sendo corrigida, nenhuma nova rodada pode ser
  // gerada — os botões saem da tela imediatamente (a regra também vale no
  // domínio, em podeGerarNovaRodada()).
  removerBotoesProximaRodada();

  // Uma única representação visual da rodada: a tabela de leitura sai e entra
  // a de correção. Antes as duas conviviam na tela, mostrando o placar antigo
  // logo acima dos campos de correção.
  removerBlocosDaRodada(rodada);

  // Some também com a classificação (ficaria congelada num estado intermediário
  // até a correção ser salva) e com a exportação.
  ["ranking-atual", "appendix-c", "btn-exportar"].forEach(id => {
    const el = document.getElementById(id);
    if (el && el.remove) el.remove();
  });

  const area = document.getElementById("torneio-area");
  const bloco = document.createElement("div");
  bloco.className = "rodada-bloco round--fix";
  bloco.id = "rodada_" + rodada + "_reaberta";
  bloco.innerHTML =
    cabecalhoRodada(rodada, " — Corrigindo Placares") +
    '<div class="callout callout--warn" style="margin-bottom:16px"><span>⚠️</span><span>' +
    "<b>Modo de correção.</b> Você está alterando os resultados desta rodada. " +
    "Os confrontos permanecem os mesmos.</span></div>";

  // Valores que a tela deve mostrar: o rascunho (se veio de um reload) ou o
  // placar que estava valendo, capturado antes do rollback.
  const temRascunho =
    rascunhos[rodada] && Object.keys(rascunhos[rodada].placares || {}).length > 0;
  if (!temRascunho) rascunhos[rodada] = { placares: placarAtual };
  const valores = rascunhos[rodada].placares || {};

  // Os campos usam o mesmo `slot` da rodada normal (com sufixo "_r"), para o
  // rascunho e a leitura seguirem uma única convenção de índice.
  //
  // Os valores vão no atributo `value` do próprio HTML, e não por uma busca
  // no DOM depois de renderizar: assim não existe caminho em que a tela é
  // desenhada mas os placares não aparecem.
  let html = '<div class="matches">';
  confrontos.forEach((par, i) => {
    const slot = par.slot !== undefined ? par.slot : i;
    if (MTR.ehBye(par[1].nome)) {
      html += cartaoBye(par[0].nome, slot);
      return;
    }
    html += confrontoEditavel(rodada, slot, par[0].nome, par[1].nome, valores[slot], "_r");
  });
  html += '</div>';
  html += '<div class="round-actions">' +
          `<button class="btn-primary" onclick="finalizarCorrecao(${rodada})">` +
          `Salvar Placares Corrigidos</button></div>`;
  bloco.innerHTML += html;
  area.appendChild(bloco);

  // Rede de segurança: se algum navegador ignorar o atributo `value`, isto
  // reaplica pela propriedade. Não apaga nada se falhar.
  aplicarRascunho(rodada, "_r");

  ligarAutosave(rodada);
  atualizarCabecalhoTorneio();
  salvarEstado();
  if (!restaurando) alert("Corrija os placares e salve novamente.");
}

// Remove todos os blocos de uma rodada (leitura e correção), para
// nunca existirem duas representações da mesma rodada na tela.
function removerBlocosDaRodada(rodada) {
  ["rodada_" + rodada, "rodada_" + rodada + "_reaberta"]
    .forEach(id => {
      const el = document.getElementById(id);
      if (el && el.remove) el.remove();
    });
}

function removerBotoesProximaRodada() {
  ["btn-proxima-auto"].forEach(id => {
    const el = document.getElementById(id);
    if (el && el.remove) el.remove();
  });
}


// Função para finalizar rodada reaberta
function finalizarCorrecao(rodada) {
  const confrontos = resultadosPorRodada[rodada];

  // Igual a finalizarRodada: lê e valida todos os placares antes de aplicar
  // qualquer um, para um campo em branco não deixar metade da rodada gravada.
  const lidos = [];

  for (let i = 0; i < confrontos.length; i++) {
    const j1 = confrontos[i][0];
    const j2 = confrontos[i][1];

    // Para partidas com Bye reabertas, não há inputs para editar
    if (MTR.ehBye(j2.nome)) continue;

    const slot = confrontos[i].slot !== undefined ? confrontos[i].slot : i;
    const input1 = document.getElementById(`r${rodada}_p${slot * 2}_r`);
    const input2 = document.getElementById(`r${rodada}_p${slot * 2 + 1}_r`);
    if (!input1 || !input2) continue; // segurança

    const p1 = parseInt(input1.value);
    const p2 = parseInt(input2.value);

    if (isNaN(p1) || isNaN(p2)) {
      alert(`Preencha todos os placares antes de finalizar (falta ${j1.nome} x ${j2.nome}).`);
      return;   // nada aplicado
    }

    const inputE = document.getElementById(`r${rodada}_e${slot}_r`);
    const emp = inputE && inputE.value !== "" ? parseInt(inputE.value) : 0;
    if (isNaN(emp) || emp < 0) {
      alert(`Empates de game inválidos em ${j1.nome} x ${j2.nome}.`);
      return;
    }

    lidos.push({ i, p1, p2, emp: emp || 0, input1 });
  }

  lidos.forEach(reg => {
    const j1 = confrontos[reg.i][0];
    const j2 = confrontos[reg.i][1];
    const { p1, p2, emp } = reg;

    const tr = reg.input1.parentElement ? reg.input1.parentElement.parentElement : null;
    const tdPlacar = tr ? tr.children[1] : null;
    if (tdPlacar) {
      tdPlacar.innerHTML = `<span>${p1} x ${p2}${emp ? ` (${emp} emp.)` : ""}</span>`;
    }

    if (p1 > p2) j1.pontos += 3;
    else if (p2 > p1) j2.pontos += 3;
    else { j1.pontos += 1; j2.pontos += 1; }

    j1.saldo += p1 - p2;
    j2.saldo += p2 - p1;

    j1.historico.push({ contra: j2.nome, placar: `${p1}x${p2}`, rodada: rodada, gamesEmpatados: emp });
    j2.historico.push({ contra: j1.nome, placar: `${p2}x${p1}`, rodada: rodada, gamesEmpatados: emp });
  });

  estadoRodadas[rodada] = "finalizada";

  // Tira a interface de correcao e deixa uma unica tabela da rodada, ja com os
  // novos resultados.
  removerBlocosDaRodada(rodada);
  redesenharRodadaLeitura(rodada);
  ultimaRodadaFinalizada = Math.max(ultimaRodadaFinalizada, rodada);
  limparRascunho(rodada);
  salvarEstado();

  mostrarRanking();
  mostrarEstatisticasAppendixC();
  botoesProximaRodada(rodada);
}


//Função para calculo do Appendix_c

function mostrarEstatisticasAppendixC() {
  const area = document.getElementById("torneio-area");
  const existente = document.getElementById("appendix-c");
  if (existente) existente.remove(); // Remove tabela anterior

  // Mesma razão de mostrarRanking(): nada de classificação com a rodada
  // parcialmente desfeita durante a correção.
  if (estadoRodadas[rodadaAtual] === "corrigindo") return;

  // Toda a matemática vem do mtr.js (validado por tests/run.js). Antes esta
  // função tinha a própria implementação, que divergia da usada no pareamento.
  const stats = MTR.classificar(
    historicoParaJogos(jogadores.filter(j => !MTR.ehBye(j.nome)))
  );

  if (!stats.length) return;

  let html = `<div class='ranking' id='appendix-c'>
    <h3>📊 Estatísticas Avançadas (Appendix C)</h3>
    <p class="nota">Desempate oficial: MP → OMW% → GW% → OGW%</p>
    <div class="table-scroll"><table><thead><tr>
      <th>#</th><th>Jogador</th><th class="num">MP</th><th class="num">OMW%</th>
      <th class="num">GW%</th><th class="num">OGW%</th><th class="num">MW%</th>
    </tr></thead><tbody>`;

  stats.forEach((s, i) => {
    html += `<tr>
      <td class="rank-pos">${i + 1}</td>
      <td><span class="nome">${escaparHtml(s.jogador)}</span></td>
      <td class="num rank-mp">${s.matchPoints}</td>
      <td class="num">${(s.omwp * 100).toFixed(1)}%</td>
      <td class="num">${(s.gameWinPerc * 100).toFixed(1)}%</td>
      <td class="num">${(s.ogwp * 100).toFixed(1)}%</td>
      <td class="num">${(s.matchWinPerc * 100).toFixed(1)}%</td>
    </tr>`;
  });

  html += "</tbody></table></div>";

  // O campeão só existe quando a ÚLTIMA rodada do torneio está finalizada.
  // Antes disso a tabela é uma classificação parcial, não um resultado.
  // Mesma condição usada para liberar a exportação — uma função só.
  if (!torneioEncerrado()) {
    html += `<p class="nota" style="margin-top:12px">Classificação parcial — ` +
            `considera apenas as rodadas já finalizadas.</p></div>`;
    area.innerHTML += html;
    return;
  }

  // O 1º da lista já é o campeão pelos critérios oficiais.
  const campeao = stats[0];
  // Usa o comparador oficial: comparar campo a campo aqui deixava o piso do
  // GW% de fora e não reconhecia como empate um 25% x 30% (ambos valem 33%).
  const empatado = !!stats[1] && MTR.estaoEmpatadosNosCriterios(campeao, stats[1]);

  html += `
    <div class="champion">
      <div class="cup">🏆</div>
      <div class="eyebrow">Torneio encerrado</div>
      <img src="${obterAvatarJogador(campeao.jogador)}" class="avatar-lg"
           onerror="this.onerror=null;this.src='img/avatar_padrao.jpg';"
           alt="${escaparHtml(campeao.jogador)}">
      <div class="nome">${escaparHtml(campeao.jogador)}</div>
      <div class="titulo">Campeão</div>
      <div class="liga">Liga ${ligaAtual || "—"}</div>
      <div class="stats">${campeao.matchPoints} MP • ` +
        `${campeao.vitorias}–${campeao.derrotas}–${campeao.empates}</div>
    </div>`;

  if (empatado) {
    html += `<div class="callout callout--warn" style="margin-top:14px"><span>⚠️</span>` +
      `<span>${escaparHtml(campeao.jogador)} e ${escaparHtml(stats[1].jogador)} empataram ` +
      `em todos os quatro critérios oficiais — o desempate precisa ser feito fora do sistema.` +
      `</span></div>`;
  }

  html += "</div>";

  area.innerHTML += html;
}

// Função PURA de exportação: recebe o estado e devolve os objetos no formato
// do jogos.json. É esta que a suíte de testes exercita — a UI abaixo só
// acrescenta prompt, Blob e download, para o teste não validar uma cópia.
function montarJogosExportados(resultados, liga, dia) {
  const jogosExportados = [];

  Object.keys(resultados)
    .map(Number)
    .sort((a, b) => a - b)
    .forEach(rodada => {
      const confrontos = resultados[rodada] || [];

      confrontos.forEach(par => {
        const j1 = par[0];
        const j2 = par[1];

        // O Bye É exportado: o jogos.json precisa dessa linha, senão o site
        // deixa de contar a rodada para o jogador no Match Win %.
        if (MTR.ehBye(j2.nome)) {
          jogosExportados.push({
            liga: liga,
            dia: dia,
            rodada: rodada,
            jogador1: j1.nome,
            resultado: "2 x 0",
            jogador2: "Bye"
          });
          return;
        }

        // O placar sai do histórico do jogador, não da tabela na tela: é a
        // mesma fonte que alimenta o ranking, então export e ranking nunca
        // divergem (antes o export dependia da posição da linha no DOM).
        const entrada = (j1.historico || []).find(
          h => h.contra === j2.nome && Number(h.rodada) === Number(rodada)
        );
        if (!entrada) return;

        const p = MTR.parsePlacar(entrada.placar);
        if (!p) return;

        const linha = {
          liga: liga,
          dia: dia,
          rodada: rodada,
          jogador1: j1.nome,
          resultado: `${p[0]} x ${p[1]}`,
          jogador2: j2.nome
        };

        // Campo opcional: só aparece quando houve game empatado, para as
        // linhas normais continuarem idênticas ao formato de sempre.
        if (entrada.gamesEmpatados) linha.gamesEmpatados = entrada.gamesEmpatados;

        jogosExportados.push(linha);
      });
    });

  return jogosExportados;
}

// O torneio só pode ser exportado depois da ÚLTIMA rodada finalizada. Exportar
// um torneio pela metade gera um arquivo incompleto com cara de legítimo.
function torneioEncerrado() {
  return Number(rodadaAtual) === Number(totalRodadas) &&
         estadoRodadas[rodadaAtual] === "finalizada";
}

// O botão é CRIADO quando o torneio termina e removido nos demais casos: assim
// "indisponível" e "inexistente" são a mesma coisa, sem como clicar por engano.
function atualizarBotaoExportar() {
  const area = document.getElementById("torneio-area");
  if (!area || !document.createElement) return;

  const existente = document.getElementById("btn-exportar");

  if (!torneioEncerrado()) {
    if (existente && existente.remove) existente.remove();
    return;
  }
  if (existente) return;

  const btn = document.createElement("button");
  btn.id = "btn-exportar";
  btn.textContent = "📤 Exportar Resultados (JSON)";
  btn.onclick = exportarResultadosParaJSON;
  area.appendChild(btn);
}

// Regra pura: dado o jogos.json e uma liga, qual é o próximo dia.
//
// A convenção `jogo.liga || 1` é a mesma do site: registros históricos sem o
// campo `liga` pertencem à Liga 1.
function calcularProximoDia(jogos, liga) {
  const dias = (jogos || [])
    .filter(j => j && Number(j.liga || 1) === Number(liga))
    .map(j => Number(j.dia))
    .filter(d => isFinite(d) && d >= 1);

  const ultimoDia = dias.length ? Math.max.apply(null, dias) : 0;
  return { ultimoDia: ultimoDia, proximoDia: ultimoDia + 1 };
}

// Consulta o histórico publicado. Só faz o fetch e valida a resposta — a regra
// fica em calcularProximoDia(), que é testável sem rede.
async function consultarProximoDia(liga) {
  try {
    // `no-store` para não sugerir um dia com base numa cópia velha em cache.
    const resp = await fetch("jogos.json", { cache: "no-store" });
    if (!resp || !resp.ok) {
      return { ok: false, erro: "HTTP " + (resp ? resp.status : "?") };
    }

    const dados = await resp.json();
    if (!Array.isArray(dados)) {
      return { ok: false, erro: "jogos.json não contém um array" };
    }

    const r = calcularProximoDia(dados, liga);
    return { ok: true, ultimoDia: r.ultimoDia, proximoDia: r.proximoDia };
  } catch (e) {
    return { ok: false, erro: e && e.message ? e.message : String(e) };
  }
}

async function exportarResultadosParaJSON() {
  // Vale no domínio, não só na interface: a função recusa mesmo se for chamada
  // direto pelo console.
  if (!torneioEncerrado()) {
    alert(
      "O torneio ainda não terminou.\n\n" +
      `Rodada atual: ${rodadaAtual} de ${totalRodadas}` +
      (estadoRodadas[rodadaAtual] ? ` (${estadoRodadas[rodadaAtual]})` : "") + ".\n" +
      "Finalize a última rodada antes de exportar os resultados."
    );
    return;
  }

  if (!ligaAtual || ligaAtual < 1) {
    alert("Defina o número da Liga no início do torneio antes de exportar.");
    return;
  }

  // Sugere o próximo dia a partir do histórico. Continua editável: o importador
  // é a segunda barreira e recusa dia fora de sequência.
  const consulta = await consultarProximoDia(ligaAtual);

  let mensagem;
  let sugestao;

  if (consulta.ok) {
    mensagem =
      `Liga ${ligaAtual}\n` +
      (consulta.ultimoDia
        ? `Último dia publicado: Dia ${consulta.ultimoDia}\n`
        : "Nenhum dia publicado ainda.\n") +
      `Próximo dia sugerido: Dia ${consulta.proximoDia}\n\n` +
      "Informe o número do dia:";
    sugestao = String(consulta.proximoDia);
  } else {
    // Nunca chutar um número quando a consulta falha.
    mensagem =
      "⚠️ Não foi possível consultar o histórico de jogos.\n" +
      "Informe manualmente o número do Dia:";
    sugestao = "";
  }

  const numeroDia = parseInt(prompt(mensagem, sugestao));
  if (!numeroDia || numeroDia < 1) return;
  diaAtual = numeroDia;

  const jogosExportados = montarJogosExportados(resultadosPorRodada, ligaAtual, numeroDia);

  if (jogosExportados.length === 0) {
    alert("Nenhum jogo válido para exportar. Verifique se as rodadas foram finalizadas.");
    return;
  }

  // 🔥 Formato “uma linha por objeto”, igual vocês gostam no jogos.json
  // Os textos passam por JSON.stringify em vez de irem interpolados entre
  // aspas: um nome com aspas ou barra invertida geraria um JSON inválido.
  const linhas = jogosExportados.map(o =>
    `{ "liga": ${o.liga}, "dia": ${o.dia}, "rodada": ${o.rodada}` +
    `, "jogador1": ${JSON.stringify(o.jogador1)}` +
    `, "resultado": ${JSON.stringify(o.resultado)}` +
    `, "jogador2": ${JSON.stringify(o.jogador2)}` +
    (o.gamesEmpatados ? `, "gamesEmpatados": ${o.gamesEmpatados}` : "") +
    ` }`
  );

  // JSON válido (sem vírgula sobrando no final)
  const conteudo = "[\n" + linhas.join(",\n") + "\n]\n";

  const blob = new Blob([conteudo], { type: "application/json" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);

  const hoje = new Date();
  const dd = String(hoje.getDate()).padStart(2, "0");
  const mm = String(hoje.getMonth() + 1).padStart(2, "0");
  const yyyy = hoje.getFullYear();

  link.download = `resultados_${dd}-${mm}-${yyyy}.json`;
  link.click();

  // O nome vem do PRÓPRIO link.download, para o comando mostrado nunca divergir
  // do arquivo que acabou de ser baixado.
  mostrarProximoPasso(link.download);
}

// Comandos do importador para um arquivo. Função pura — os testes conferem os
// dois textos sem depender de DOM.
function comandosDeImportacao(nomeArquivo) {
  var base = "node importar-resultados.js " + nomeArquivo;
  return { validar: base, publicar: base + " --apply" };
}

// Copia para a área de transferência quando a API existe. Uma falha aqui nunca
// pode atrapalhar a exportação, que já aconteceu — o comando continua visível
// na tela para seleção manual.
function copiarTexto(texto, botao) {
  const aviso = (msg) => { if (botao) botao.textContent = msg; };

  try {
    if (typeof navigator !== "undefined" && navigator.clipboard &&
        navigator.clipboard.writeText) {
      navigator.clipboard.writeText(texto).then(
        () => aviso("✅ Copiado!"),
        () => aviso("Copie manualmente abaixo")
      );
      return;
    }
  } catch (e) { /* segue para o aviso manual */ }

  aviso("Copie manualmente abaixo");
}

// Lembrete operacional depois da exportação: o que fazer com o arquivo.
// Não executa nada — só mostra os comandos prontos.
function mostrarProximoPasso(nomeArquivo) {
  const area = document.getElementById("torneio-area");
  if (!area || !document.createElement) return;

  const anterior = document.getElementById("proximo-passo");
  if (anterior && anterior.remove) anterior.remove();

  const cmd = comandosDeImportacao(nomeArquivo);

  const bloco = document.createElement("div");
  bloco.id = "proximo-passo";
  // Atenção ao montar este HTML: o texto dos comandos tem de ficar DIRETO
  // dentro do <pre>, sem elementos aninhados — é assim que a suíte confere
  // qual comando está sendo mostrado.
  bloco.innerHTML = `
    <h3>✅ Resultados exportados</h3>
    <p class="nota">Publicação dos resultados no site</p>

    <p>Arquivo gerado: <code id="pp-arquivo">${nomeArquivo}</code><br>
       Coloque-o na pasta <code>LigaSupermarket</code> e rode os comandos abaixo.</p>

    <div class="step">
      <div class="step-label">Passo 1 — Validar</div>
      <pre id="pp-cmd-validar">${cmd.validar}</pre>
      <button id="pp-copiar-validar" class="btn-ghost">📋 Copiar comando de validação</button>
    </div>

    <div class="step step--publish">
      <div class="step-label">Passo 2 — Publicar</div>
      <pre id="pp-cmd-publicar">${cmd.publicar}</pre>
      <button id="pp-copiar-publicar">📋 Copiar comando para PUBLICAR</button>
      <div class="callout callout--warn" style="margin-top:12px"><span>⚠️</span><span>
        Use <code>--apply</code> somente depois que a validação tiver passado.
      </span></div>
    </div>
  `;

  area.appendChild(bloco);

  const btnValidar = document.getElementById("pp-copiar-validar");
  const btnPublicar = document.getElementById("pp-copiar-publicar");
  if (btnValidar) btnValidar.onclick = () => copiarTexto(cmd.validar, btnValidar);
  if (btnPublicar) btnPublicar.onclick = () => copiarTexto(cmd.publicar, btnPublicar);
}
