<script>
function baixarPagina() {
  const html = document.documentElement.outerHTML;
  const blob = new Blob([html], { type: "text/html" });
  const link = document.createElement("a");
  const nomeArquivo = prompt("Digite o nome do arquivo (ex: dia-03.html):", "dia-03.html") || "dia-x.html";
  link.href = URL.createObjectURL(blob);
  link.download = nomeArquivo;
  link.click();
}
</script>
<!-- Selecionar Jogadores -->
<script>
async function carregarJogadores() {
  try {
    const res = await fetch("jogadores.json");
    const lista = await res.json();
    const div = document.getElementById("lista-jogadores");
    div.innerHTML = "";

    lista.sort((a, b) => a.localeCompare(b, 'pt-BR'));


    lista.forEach(nome => {
      const id = "jog_" + nome.replace(/\s+/g, "_");
      div.innerHTML += `
        <div style="display: flex; align-items: center; margin-bottom: 0px;">
        <input type="checkbox" value="${nome}" id="${id}" style="width: 16px; height: 16px; margin-right: 6px;" />
        <label for="${id}" style="color: #f5f5dc;">${nome}</label>
       </div>`;
       
    });

    vincularEventosCheckbox();
    atualizarContadorSelecionados();



  } catch (err) {
    document.getElementById("lista-jogadores").innerText = "Erro ao carregar jogadores.";
  }
}

function adicionarJogador() {
  const nome = document.getElementById("novo-jogador").value.trim();
  if (!nome) return;
  const id = "jog_" + nome.replace(/\s+/g, "_");
  if (document.getElementById(id)) {
    alert("Jogador já está na lista.");
    return;
  }
  const div = document.getElementById("lista-jogadores");
  div.innerHTML += `
        <div style="display: flex; align-items: center; margin-bottom: 1px;">
        <input type="checkbox" value="${nome}" id="${id}" style="width: 16px; height: 16px; margin-right: 6px;"  />
        <label for="${id}" style="margin-left: 0px; color: #f5f5dc;">${nome}</label>
        </div>`;
  document.getElementById("novo-jogador").value = "";
  
  vincularEventosCheckbox(); // AQUI ESTOU NA DUVIDA SE COLOQUEI NO LUGAR CERTO
  atualizarContadorSelecionados();
  
}

carregarJogadores();





let jogadoresConfirmados = false;

function vincularEventosCheckbox() {
  const checks = document.querySelectorAll("#lista-jogadores input[type=checkbox]");
  checks.forEach(cb => {
    // evita duplicar listener
    if (cb.dataset.listener === "1") return;

    cb.addEventListener("change", () => {
      jogadoresConfirmados = false;
      document.getElementById("confirmacao-jogadores").style.display = "none";
      desabilitarIniciar();
      atualizarContadorSelecionados();
    });

    cb.dataset.listener = "1";
  });
}

function atualizarContadorSelecionados() {
  const checks = document.querySelectorAll("#lista-jogadores input[type=checkbox]:checked");
  document.getElementById("qtd-selecionados").textContent = checks.length;
}

function abrirConfirmacaoJogadores() {
  const checks = document.querySelectorAll("#lista-jogadores input[type=checkbox]:checked");
  const selecionados = Array.from(checks).map(c => c.value);

  if (selecionados.length === 0) {
    alert("Selecione pelo menos 1 jogador antes de incluir.");
    return;
  }

  // monta a prévia
  // Ordena alfabeticamente
  selecionados.sort((a, b) => a.localeCompare(b, "pt-BR"));

const total = selecionados.length;

// Verifica se é ímpar
const avisoBye = total % 2 !== 0
  ? `<p style="color: gold; margin: 0 0 10px 0;">
       ⚠ Número ímpar de jogadores. Cada rodada terá um jogador com <strong>Bye</strong>.
     </p>`
  : "";

const listaHtml = `
  <p style="margin: 0 0 10px 0;">
    <strong>Total selecionados: ${total}</strong>
  </p>
  ${avisoBye}
  <ol style="margin:0; padding-left: 22px;">
    ${selecionados.map(n => `<li>${n}</li>`).join("")}
  </ol>
`;

  document.getElementById("lista-confirmacao").innerHTML = listaHtml;
  document.getElementById("confirmacao-jogadores").style.display = "block";
}

function confirmarJogadores() {
  jogadoresConfirmados = true;
  habilitarIniciar();
  alert("Jogadores confirmados! Agora você pode iniciar o torneio.");
}

function refazerSelecao() {
  jogadoresConfirmados = false;
  document.getElementById("confirmacao-jogadores").style.display = "none";
  desabilitarIniciar();
}

function habilitarIniciar() {
  const btn = document.getElementById("btn-iniciar");
  btn.disabled = false;
  btn.style.opacity = "1";
  btn.style.cursor = "pointer";
}

function desabilitarIniciar() {
  const btn = document.getElementById("btn-iniciar");
  btn.disabled = true;
  btn.style.opacity = "0.5";
  btn.style.cursor = "not-allowed";
}









</script>
<script>
let jogadores = [];
let resultadosPorRodada = {};
let rodadaAtual = 0;
let totalRodadas = 0;
let confrontosAnteriores = new Set();
let ligaAtual = null;
let ultimaRodadaFinalizada = 0;   // só ela pode ser corrigida
let diaAtual = null;              // guardado para a exportação e o autosave

// Situação de cada rodada, para a recuperação saber o que redesenhar:
//   "gerada"     -> automática, pareada, aguardando placares
//   "manual"     -> formulário de pareamento manual aberto, em preenchimento
//   "finalizada" -> concluída
//   "corrigindo" -> em correção de placares
let estadoRodadas = {};

// O que já foi digitado mas ainda não finalizado, para não se perder num reload.
//   rascunhos[n] = { numLinhas, pares: {slot:[j1,j2]}, placares: {slot:[p1,p2,emp]} }
let rascunhos = {};

function limparRascunho(rodada) {
  delete rascunhos[rodada];
}

// Lê o que está na tela da rodada em andamento e guarda no rascunho.
// Chamado nos eventos `change` dos selects e dos campos de placar.
function capturarRascunho(rodada) {
  const r = rascunhos[rodada] || (rascunhos[rodada] = { pares: {}, placares: {} });

  for (let i = 0; ; i++) {
    const s1 = document.getElementById(`r${rodada}_j1_${i}`);
    const s2 = document.getElementById(`r${rodada}_j2_${i}`);
    if (!s1 || !s2) break;
    r.numLinhas = i + 1;
    if (s1.value || s2.value) r.pares[i] = [s1.value, s2.value];
    else delete r.pares[i];
  }

  for (let slot = 0; ; slot++) {
    const p1 = document.getElementById(`r${rodada}_p${slot * 2}`);
    const p2 = document.getElementById(`r${rodada}_p${slot * 2 + 1}`);
    if (!p1 || !p2) break;
    const e = document.getElementById(`r${rodada}_e${slot}`);
    if (p1.value !== "" || p2.value !== "") {
      r.placares[slot] = [p1.value, p2.value, e ? e.value : ""];
    } else {
      delete r.placares[slot];
    }
  }

  salvarEstado();
}

// Liga o autosave nos campos de uma rodada recém-desenhada.
function ligarAutosave(rodada) {
  const bloco = document.getElementById("rodada_" + rodada) ||
                document.getElementById("rodada_" + rodada + "_manual") ||
                document.getElementById("rodada_" + rodada + "_reaberta");
  if (!bloco || !bloco.querySelectorAll) return;

  bloco.querySelectorAll("input, select").forEach(el => {
    el.addEventListener("change", () => capturarRascunho(rodada));
  });
}

// Reaplica na tela um rascunho restaurado do localStorage.
function aplicarRascunho(rodada) {
  const r = rascunhos[rodada];
  if (!r) return;

  Object.keys(r.pares || {}).forEach(i => {
    const s1 = document.getElementById(`r${rodada}_j1_${i}`);
    const s2 = document.getElementById(`r${rodada}_j2_${i}`);
    if (s1) s1.value = r.pares[i][0];
    if (s2) s2.value = r.pares[i][1];
  });

  Object.keys(r.placares || {}).forEach(slot => {
    const v = r.placares[slot];
    const p1 = document.getElementById(`r${rodada}_p${slot * 2}`);
    const p2 = document.getElementById(`r${rodada}_p${Number(slot) * 2 + 1}`);
    const e = document.getElementById(`r${rodada}_e${slot}`);
    if (p1) p1.value = v[0];
    if (p2) p2.value = v[1];
    if (e && v[2]) e.value = v[2];
  });
}

// ---------------------------------------------------------------------------
// Helpers de estado (usados pelo fluxo manual, pela reabertura e pelo autosave)
// ---------------------------------------------------------------------------

function jogadoresAtivos() {
  return jogadores.filter(j => !MTR.ehBye(j.nome));
}

function acharJogador(nome) {
  return jogadores.find(j => j.nome === nome);
}

function jaRecebeuBye(nome) {
  const j = acharJogador(nome);
  return !!j && (j.historico || []).some(h => MTR.ehBye(h.contra));
}

// Registra um confronto nos dois sentidos. `Pareamento.chave` é canônica, mas
// confrontosAnteriores é consultado com a chave "a|b" crua, então gravamos as
// duas direções para as consultas continuarem simples.
function registrarConfronto(nomeA, nomeB) {
  confrontosAnteriores.add(nomeA + "|" + nomeB);
  confrontosAnteriores.add(nomeB + "|" + nomeA);
}

// ---------------------------------------------------------------------------
// Persistência: se o navegador fechar, atualizar ou travar no meio de um dia
// de jogos, o torneio é recuperado do localStorage.
// ---------------------------------------------------------------------------

const CHAVE_ESTADO = "ligaSupermarket:torneioEmAndamento";

function temStorage() {
  try { return typeof localStorage !== "undefined"; } catch (e) { return false; }
}

// resultadosPorRodada guarda REFERÊNCIAS aos objetos de `jogadores`. Salvar
// direto duplicaria cada jogador e, ao restaurar, os pontos deixariam de
// acompanhar o histórico. Por isso os confrontos vão só como nomes + slot, e
// a restauração religa as referências pelo nome.
function serializarEstado() {
  const resultados = {};
  Object.keys(resultadosPorRodada).forEach(r => {
    resultados[r] = resultadosPorRodada[r].map(par => ({
      j1: par[0].nome,
      j2: par[1].nome,
      slot: par.slot
    }));
  });

  return {
    versao: 1,
    salvoEm: new Date().toISOString(),
    ligaAtual: ligaAtual,
    diaAtual: diaAtual,
    rodadaAtual: rodadaAtual,
    totalRodadas: totalRodadas,
    ultimaRodadaFinalizada: ultimaRodadaFinalizada,
    estadoRodadas: estadoRodadas,
    rascunhos: rascunhos,
    jogadores: jogadores.map(j => ({
      nome: j.nome,
      pontos: j.pontos,
      saldo: j.saldo,
      historico: j.historico
    })),
    resultados: resultados,
    confrontosAnteriores: Array.from(confrontosAnteriores)
  };
}

function aplicarEstado(estado) {
  ligaAtual = estado.ligaAtual;
  diaAtual = estado.diaAtual;
  rodadaAtual = estado.rodadaAtual;
  totalRodadas = estado.totalRodadas;
  ultimaRodadaFinalizada = estado.ultimaRodadaFinalizada || 0;
  estadoRodadas = estado.estadoRodadas || {};
  rascunhos = estado.rascunhos || {};

  jogadores = (estado.jogadores || []).map(j => ({
    nome: j.nome,
    pontos: j.pontos || 0,
    saldo: j.saldo || 0,
    historico: j.historico || []
  }));

  confrontosAnteriores = new Set(estado.confrontosAnteriores || []);

  // Religa as referências: cada confronto volta a apontar para o MESMO objeto
  // que está em `jogadores`, não para uma cópia.
  resultadosPorRodada = {};
  Object.keys(estado.resultados || {}).forEach(r => {
    resultadosPorRodada[r] = estado.resultados[r].map(p => {
      const par = [
        MTR.ehBye(p.j1) ? { nome: "Bye" } : acharJogador(p.j1),
        MTR.ehBye(p.j2) ? { nome: "Bye" } : acharJogador(p.j2)
      ];
      par.slot = p.slot;
      return par;
    });
  });
}

function salvarEstado() {
  if (!temStorage()) return;
  try {
    if (!jogadores.length) return;
    localStorage.setItem(CHAVE_ESTADO, JSON.stringify(serializarEstado()));
  } catch (e) {
    console.warn("Não foi possível salvar o torneio:", e);
  }
}

function lerEstadoSalvo() {
  if (!temStorage()) return null;
  try {
    const bruto = localStorage.getItem(CHAVE_ESTADO);
    if (!bruto) return null;
    const estado = JSON.parse(bruto);
    if (!estado || !estado.jogadores || !estado.jogadores.length) return null;
    return estado;
  } catch (e) {
    return null;
  }
}

function apagarEstadoSalvo() {
  if (!temStorage()) return;
  try { localStorage.removeItem(CHAVE_ESTADO); } catch (e) {}
}

function descartarTorneioSalvo() {
  if (!confirm("Apagar o torneio salvo e começar do zero?")) return;
  apagarEstadoSalvo();
  location.reload();
}

// Redesenha cada rodada CONFORME O SEU ESTADO. Antes tudo que estivesse em
// resultadosPorRodada virava tabela de leitura, então uma rodada gerada e ainda
// não finalizada aparecia como histórica — e uma rodada manual em preenchimento
// sumia por completo, já que só entra em resultadosPorRodada na finalização.
function redesenharRodadas() {
  const area = document.getElementById("torneio-area");
  if (!area) return;
  area.style.display = "block";

  const rodadas = new Set(
    Object.keys(resultadosPorRodada).map(Number)
      .concat(Object.keys(estadoRodadas).map(Number))
  );

  Array.from(rodadas).sort((a, b) => a - b).forEach(r => {
    const situacao = estadoRodadas[r] || "finalizada";

    if (situacao === "manual") { redesenharRodadaManual(r); return; }
    if (situacao === "gerada") { redesenharRodadaEditavel(r); return; }
    if (situacao === "corrigindo") { corrigirPlacares(r, true); return; }

    redesenharRodadaLeitura(r);
  });
}

function redesenharRodadaLeitura(r) {
  const area = document.getElementById("torneio-area");
  const bloco = document.createElement("div");
  bloco.className = "rodada-bloco";
  bloco.id = "rodada_" + r;

  let html = `<h2>Rodada ${r}</h2>` +
    '<table><thead><tr><th>Jogador 1</th><th>Placar</th><th>Jogador 2</th></tr></thead><tbody>';

  (resultadosPorRodada[r] || []).forEach(par => {
    if (MTR.ehBye(par[1].nome)) {
      html += `<tr><td colspan="3">${par[0].nome} folgou nesta rodada (Bye)</td></tr>`;
      return;
    }
    const h = (par[0].historico || []).find(
      x => x.contra === par[1].nome && Number(x.rodada) === Number(r)
    );
    const p = h ? MTR.parsePlacar(h.placar) : null;
    const texto = p ? `${p[0]} x ${p[1]}` : "—";
    const emp = h && h.gamesEmpatados ? ` (${h.gamesEmpatados} emp.)` : "";
    html += `<tr><td>${par[0].nome}</td><td>${texto}${emp}</td><td>${par[1].nome}</td></tr>`;
  });

  html += "</tbody></table>";
  bloco.innerHTML = html;
  area.appendChild(bloco);
}

// Rodada automática pareada mas ainda sem placares: volta EDITÁVEL, com os
// mesmos confrontos e o que já tinha sido digitado.
function redesenharRodadaEditavel(r) {
  const area = document.getElementById("torneio-area");
  const bloco = document.createElement("div");
  bloco.className = "rodada-bloco";
  bloco.id = "rodada_" + r;

  let html = `<h2>Rodada ${r}</h2>` +
    '<table><thead><tr><th>Jogador 1</th><th>Placar</th><th>Jogador 2</th></tr></thead><tbody>';

  (resultadosPorRodada[r] || []).forEach((par, i) => {
    const slot = par.slot !== undefined ? par.slot : i;
    if (MTR.ehBye(par[1].nome)) {
      html += `<tr data-slot="${slot}"><td colspan="3">${par[0].nome} folga nesta rodada (Bye)</td></tr>`;
      return;
    }
    html += `
      <tr data-slot="${slot}">
        <td>${par[0].nome}</td>
        <td class="placar-input">
          <input type="number" min="0" id="r${r}_p${slot * 2}">
          <span>x</span>
          <input type="number" min="0" id="r${r}_p${slot * 2 + 1}">
          ${campoEmpates(r, slot)}
        </td>
        <td>${par[1].nome}</td>
      </tr>`;
  });

  html += "</tbody></table>";
  html += blocoEmpatesToggle(r);
  html += `<button onclick="finalizarRodada(${r})">Finalizar Rodada ${r}</button>`;
  bloco.innerHTML = html;
  area.appendChild(bloco);

  aplicarRascunho(r);
  ligarAutosave(r);
}

// Rodada manual em preenchimento: reconstrói os selects com as escolhas feitas.
function redesenharRodadaManual(r) {
  const area = document.getElementById("torneio-area");
  const bloco = document.createElement("div");
  bloco.className = "rodada-bloco";
  bloco.id = "rodada_" + r + "_manual";

  const disponiveis = jogadoresAtivos();
  const temBye = disponiveis.length % 2 !== 0;
  const numJogos = (rascunhos[r] && rascunhos[r].numLinhas) || Math.ceil(disponiveis.length / 2);

  let opcoes = '<option value="">Selecione</option>';
  disponiveis.forEach(j => { opcoes += `<option value="${j.nome}">${j.nome}</option>`; });
  if (temBye) opcoes += '<option value="Bye">Bye</option>';

  let html = `<h2>Rodada ${r} (Manual)</h2>` +
    '<table><thead><tr><th>Jogador 1</th><th>Placar</th><th>Jogador 2</th></tr></thead><tbody>';

  for (let i = 0; i < numJogos; i++) {
    html += `
      <tr data-slot="${i}">
        <td><select id="r${r}_j1_${i}">${opcoes}</select></td>
        <td class="placar-input">
          <input type="number" min="0" id="r${r}_p${i * 2}">
          <span>x</span>
          <input type="number" min="0" id="r${r}_p${i * 2 + 1}">
          ${campoEmpates(r, i)}
        </td>
        <td><select id="r${r}_j2_${i}">${opcoes}</select></td>
      </tr>`;
  }

  html += "</tbody></table>";
  html += blocoEmpatesToggle(r);
  html += `<button onclick="finalizarRodada(${r})">Finalizar Rodada ${r}</button>`;
  bloco.innerHTML = html;
  area.appendChild(bloco);

  aplicarRascunho(r);
  ligarAutosave(r);
}

function rodadaAtualEstaFinalizada() {
  if (rodadaAtual === 0) return true;   // nenhuma rodada gerada ainda
  return (estadoRodadas[rodadaAtual] || "finalizada") === "finalizada";
}

function retomarTorneioSalvo(estado) {
  aplicarEstado(estado);
  redesenharRodadas();
  mostrarRanking();
  mostrarEstatisticasAppendixC();

  const area = document.getElementById("torneio-area");

  // A próxima rodada só é oferecida se a atual estiver de fato finalizada —
  // antes o botão aparecia mesmo com a rodada em andamento, e gerar a seguinte
  // pularia a atual em silêncio.
  if (rodadaAtualEstaFinalizada() && rodadaAtual < totalRodadas) {
    const botaoAuto = document.createElement("button");

    `Existe um torneio em andamento (Liga ${estado.ligaAtual}, ` +
    `rodada ${estado.rodadaAtual} de ${estado.totalRodadas}, salvo em ${quando}).\n\n` +

// Converte o histórico dos jogadores para o formato de jogos que o mtr.js lê.
// É a partir daqui que TODOS os números da ferramenta são calculados — não há
// mais uma segunda implementação dos percentuais nesta página.
function historicoParaJogos(listaJogadores) {
  const jogos = [];
  const vistos = {};

  listaJogadores.forEach(j => {
    j.historico.forEach(h => {
      if (MTR.ehBye(h.contra)) {
        jogos.push({ jogador1: j.nome, resultado: "2 x 0", jogador2: "Bye" });
        return;
      }
      // Cada partida aparece no histórico dos dois jogadores; registra uma vez.
      const id = (h.rodada || 0) + "#" + [j.nome, h.contra].sort().join("|");
      if (vistos[id]) return;
      vistos[id] = true;

      const p = MTR.parsePlacar(h.placar);
      if (!p) return;
      jogos.push({
        jogador1: j.nome,
        resultado: p[0] + " x " + p[1],
        jogador2: h.contra,
        gamesEmpatados: h.gamesEmpatados || 0
      });
    });
  });

  return jogos;
}

// Ordenação oficial (MTR Appendix C): MP -> OMW% -> GW% -> OGW%.
// Empates reais são desfeitos por sorteio, com embaralhamento uniforme.
function ordenarJogadoresSuico(jogadores) {
  const registros = MTR.construirRegistros(historicoParaJogos(jogadores));

  const stats = jogadores.map(j => {
    const r = registros[j.nome] || MTR.novoRegistro();
    return {
      ...j,
      matchPoints: r.matchPoints,
      matchWinPerc: MTR.matchWinPctRaw(r),
      gameWinPerc: MTR.gameWinPctRaw(r),
      omwp: MTR.opponentsMatchWinPct(r, registros),
      ogwp: MTR.opponentsGameWinPct(r, registros)
    };
  });

  // Embaralha antes de ordenar: como o sort do JS é estável e compararCriterios
  // devolve 0 no empate real, quem empatar nos quatro critérios fica em ordem
  // sorteada, e não sempre na mesma.
  //
  // Usa o comparador do mtr.js — que aplica o piso de 33% ao GW%. Uma ordenação
  // própria aqui deixava o piso de fora e alterava tanto a ordem do pareamento
  // quanto quem recebia o BYE (escolherBye lê esta lista de trás para frente).
  Pareamento.embaralhar(stats);
  stats.sort((a, b) => MTR.compararCriterios(
    { matchPoints: a.matchPoints, omwp: a.omwp, gameWinPerc: a.gameWinPerc, ogwp: a.ogwp },
    { matchPoints: b.matchPoints, omwp: b.omwp, gameWinPerc: b.gameWinPerc, ogwp: b.ogwp }
  ));

  return stats;
}


function gerarRodada() {
  removerBotaoReabrirAnterior();
  rodadaAtual++;
  // Garantir que pontos e saldo estejam sempre consistentes com o histórico
  jogadores.forEach(j => {
  let pontos = 0;
  let saldo = 0;

  j.historico.forEach(h => {
    const placar = h.placar.replace("(bye)", "").trim();
    if (!placar.includes("x")) return;

    const [g1, g2] = placar.split("x").map(Number);
    if (isNaN(g1) || isNaN(g2)) return;

    if (g1 > g2) pontos += 3;
    else if (g1 === g2) pontos += 1;

    saldo += g1 - g2;
  });

  j.pontos = pontos;
  j.saldo = saldo;
  });




  const area = document.getElementById("torneio-area");

  const bloco = document.createElement("div");
  bloco.className = "rodada-bloco";
  bloco.id = "rodada_" + rodadaAtual;
  bloco.innerHTML = "<h2>Rodada " + rodadaAtual + "</h2>";

  let jogadoresOrdenados;

if (rodadaAtual === 1) {
  // Primeira rodada: ninguém tem histórico, então a ordem é sorteada.
  jogadoresOrdenados = Pareamento.embaralhar(
    [...jogadores].filter(j => !MTR.ehBye(j.nome))
  );
} else {
  // Demais rodadas: ordenação oficial do Appendix C
  jogadoresOrdenados = ordenarJogadoresSuico(jogadores.filter(j => !MTR.ehBye(j.nome)));
}

  // Pareamento suíço com faixas de pontuação e backtracking (pareamento.js).
  // Só repete um confronto quando é matematicamente inevitável — e avisa.
  const porNome = {};
  jogadores.forEach(j => { porNome[j.nome] = j; });

  const nomesOrdenados = jogadoresOrdenados.map(j => j.nome);

  const resultado = Pareamento.gerarRodada(
    nomesOrdenados,
    (a, b) => confrontosAnteriores.has(a + "|" + b),
    (nome) => (porNome[nome].historico || []).some(h => MTR.ehBye(h.contra))
  );

  const confrontos = [];

  if (resultado.bye) {
    const byePlayer = porNome[resultado.bye];
    confrontos.push([byePlayer, { nome: "Bye" }]);
    byePlayer.pontos += 3;
    byePlayer.saldo += 2;
    byePlayer.historico.push({ contra: "Bye", placar: "2x0 (bye)", rodada: rodadaAtual });
  }

  resultado.pares.forEach(par => {
    const j1 = porNome[par[0]];
    const j2 = porNome[par[1]];
    confrontos.push([j1, j2]);
    confrontosAnteriores.add(j1.nome + "|" + j2.nome);
    confrontosAnteriores.add(j2.nome + "|" + j1.nome);
  });

  if (resultado.repeticoesForcadas.length) {
    const lista = resultado.repeticoesForcadas
      .map(p => p[0] + " x " + p[1]).join("\n  ");
    bloco.innerHTML +=
      '<p style="color:#ffcc66;border:1px solid #ffcc66;padding:8px;border-radius:6px">' +
      "⚠️ Não existe pareamento sem repetição nesta rodada. " +
      "Estes confrontos já aconteceram e se repetem:<br><b>" +
      resultado.repeticoesForcadas.map(p => p[0] + " x " + p[1]).join("<br>") +
      "</b></p>";
    console.warn("Repetições inevitáveis na rodada " + rodadaAtual + ":\n  " + lista);
  }

  resultadosPorRodada[rodadaAtual] = confrontos;
  estadoRodadas[rodadaAtual] = "gerada";

  // `slot` é o índice da LINHA na tabela, gravado no próprio confronto.
  // Ler o placar por ele, e não pela posição no array, é o que impede que os
  // placares sejam atribuídos ao jogo errado quando há Bye ou linha pulada.
  let html = '<table><thead><tr><th>Jogador 1</th><th>Placar</th><th>Jogador 2</th></tr></thead><tbody>';
  confrontos.forEach((par, i) => {
    par.slot = i;
    if (par[1].nome === "Bye") {
      html += `<tr data-slot="${i}"><td colspan="3">${par[0].nome} folga nesta rodada (Bye)</td></tr>`;
    } else {
      html += `
        <tr data-slot="${i}">
          <td>${par[0].nome}</td>
          <td class="placar-input">
            <input type="number" min="0" id="r${rodadaAtual}_p${i * 2}">
            <span>x</span>
            <input type="number" min="0" id="r${rodadaAtual}_p${i * 2 + 1}">
            ${campoEmpates(rodadaAtual, i)}
          </td>
          <td>${par[1].nome}</td>
        </tr>
      `;
    }
  });

  html += '</tbody></table>';
  html += blocoEmpatesToggle(rodadaAtual);
  html += `<button onclick="finalizarRodada(${rodadaAtual})">Finalizar Rodada ${rodadaAtual}</button> ` +
          `<button id="btn-reabrir-${rodadaAtual}" onclick="corrigirPlacares(${rodadaAtual})">Corrigir Placares</button>`;
  bloco.innerHTML += html;
  area.appendChild(bloco);
  ligarAutosave(rodadaAtual);
  salvarEstado();
}

// Checkbox que revela os campos de empate de game. Fica desmarcado por padrão:

// Campo de empates embutido na própria célula do placar — assim a tabela

  rascunhos[rodadaAtual] = { numLinhas: numJogos, pares: {}, placares: {} };

  ligarAutosave(rodadaAtual);

// Assim que uma nova rodada e gerada, a anterior deixa de poder ser reaberta:
// tiramos o botao para a interface nao oferecer o que sera recusado.
function removerBotaoReabrirAnterior() {
  const btn = document.getElementById("btn-reabrir-" + rodadaAtual);
  if (btn) btn.remove();
}


// ---------------------------------------------------------------------------
// Rodada manual em três fases: ler -> validar -> aplicar.
// A separação é o que garante atomicidade: nada é gravado antes de a rodada
// inteira ser considerada válida.
// ---------------------------------------------------------------------------

// FASE 1 — lê a tela para uma representação temporária. Não toca em nada.
function lerRodadaManual(rodada) {
  const linhas = [];
  let i = 0;

  while (true) {
    const sel1 = document.getElementById(`r${rodada}_j1_${i}`);
    const sel2 = document.getElementById(`r${rodada}_j2_${i}`);
    if (!sel1 || !sel2) break;               // acabaram as linhas da tabela

    const nome1 = (sel1.value || "").trim();
    const nome2 = (sel2.value || "").trim();

    // Linha totalmente vazia é ignorada (permite organizar a tela), mas a
    // validação de completude adiante impede finalizar uma rodada incompleta.
    if (!nome1 && !nome2) { i++; continue; }

    linhas.push({ slot: i, nome1: nome1, nome2: nome2 });
    i++;
  }

  return { linhas: linhas };
}

// FASE 2 — valida tudo e devolve TODOS os erros encontrados.
function validarRodadaManual(linhas, rodada) {
  const erros = [];
  const ativos = jogadoresAtivos().map(j => j.nome);

  if (!linhas.length) {
    return ["Defina os confrontos da rodada."];
  }

  // --- estrutura de cada linha
  const usos = {};                 // nome -> quantas vezes apareceu
  const comBye = [];               // jogadores que receberiam BYE nesta rodada

  linhas.forEach(l => {
    const rotulo = "linha " + (l.slot + 1);

    if (!l.nome1 || !l.nome2) {
      erros.push(`${rotulo}: selecione os dois jogadores.`);
      return;
    }
    if (l.nome1 === l.nome2) {
      erros.push(`${rotulo}: um jogador não pode enfrentar ele mesmo.`);
      return;
    }

    const ehBye1 = MTR.ehBye(l.nome1);
    const ehBye2 = MTR.ehBye(l.nome2);

    if (ehBye1 && ehBye2) {
      erros.push(`${rotulo}: não é possível parear Bye contra Bye.`);
      return;
    }

    if (ehBye1 || ehBye2) {
      const real = ehBye1 ? l.nome2 : l.nome1;
      if (!acharJogador(real)) {
        erros.push(`${rotulo}: jogador "${real}" não está no torneio.`);
        return;
      }
      comBye.push(real);
      usos[real] = (usos[real] || 0) + 1;
      return;
    }

    [l.nome1, l.nome2].forEach(n => {
      if (!acharJogador(n)) {
        erros.push(`${rotulo}: jogador "${n}" não está no torneio.`);
        return;
      }
      usos[n] = (usos[n] || 0) + 1;
    });
  });

  // --- ninguém duas vezes
  Object.keys(usos).forEach(n => {
    if (usos[n] > 1) erros.push(`${n} aparece em ${usos[n]} jogos nesta rodada.`);
  });

  // --- ninguém de fora
  const faltando = ativos.filter(n => !usos[n]);
  if (faltando.length) {
    erros.push(
      `Estes jogadores ficaram sem jogo nem Bye: ${faltando.join(", ")}.`
    );
  }

  // --- quantidade de BYEs coerente com o número de jogadores
  const impar = ativos.length % 2 !== 0;
  if (impar && comBye.length !== 1) {
    erros.push(
      comBye.length === 0
        ? `Com ${ativos.length} jogadores (número ímpar) é preciso definir exatamente um Bye.`
        : `Só pode haver um Bye por rodada — foram definidos ${comBye.length}.`
    );
  }
  if (!impar && comBye.length > 0) {
    erros.push(
      `Com ${ativos.length} jogadores (número par) não deve haver Bye nesta rodada.`
    );
  }

  // --- BYE repetido: mesma regra do automático (pareamento.js -> escolherBye)
  comBye.forEach(nome => {
    if (!jaRecebeuBye(nome)) return;
    const elegiveis = ativos.filter(n => n !== nome && !jaRecebeuBye(n));
    if (elegiveis.length) {
      erros.push(
        `${nome} já recebeu Bye neste torneio. Ainda há jogadores que nunca folgaram: ` +
        `${elegiveis.join(", ")}.`
      );
    }
  });

  return erros;
}

// FASE 2b — lê os placares das linhas JÁ VALIDADAS, sem aplicar nada.
// Lê pelo `slot` de cada linha, não pela posição no array.
// Devolve { placares, erros }.
function lerPlacaresManual(linhas, rodada) {
  const placares = {};
  const erros = [];

  linhas.forEach(l => {
    if (MTR.ehBye(l.nome1) || MTR.ehBye(l.nome2)) return;  // Bye não tem placar

    const i1 = document.getElementById(`r${rodada}_p${l.slot * 2}`);
    const i2 = document.getElementById(`r${rodada}_p${l.slot * 2 + 1}`);
    if (!i1 || !i2) {
      erros.push(`Campos de placar não encontrados para ${l.nome1} x ${l.nome2}.`);
      return;
    }

    const p1 = parseInt(i1.value);
    const p2 = parseInt(i2.value);
    if (isNaN(p1) || isNaN(p2)) {
      erros.push(`Falta o placar de ${l.nome1} x ${l.nome2}.`);
      return;
    }

    const ie = document.getElementById(`r${rodada}_e${l.slot}`);
    const emp = ie && ie.value !== "" ? parseInt(ie.value) : 0;
    if (isNaN(emp) || emp < 0) {
      erros.push(`Empates de game inválidos em ${l.nome1} x ${l.nome2}.`);
      return;
    }

    placares[l.slot] = { p1: p1, p2: p2, emp: emp || 0 };
  });

  return { placares: placares, erros: erros };
}

// FASE 3 — aplica pareamento E placares numa única etapa.
// Só é chamada quando pares e placares passaram inteiros na validação, então
// não existe estado intermediário: ou tudo é gravado, ou nada é.
function aplicarRodadaManual(linhas, placares, rodada) {
  const confrontos = [];

  linhas.forEach(l => {
    const ehBye1 = MTR.ehBye(l.nome1);
    const ehBye2 = MTR.ehBye(l.nome2);

    if (ehBye1 || ehBye2) {
      const jReal = acharJogador(ehBye1 ? l.nome2 : l.nome1);
      const par = [jReal, { nome: "Bye" }];
      par.slot = l.slot;
      confrontos.push(par);

      jReal.pontos += 3;
      jReal.saldo += 2;
      jReal.historico.push({ contra: "Bye", placar: "2x0 (bye)", rodada: rodada });
      return;
    }

    const j1 = acharJogador(l.nome1);
    const j2 = acharJogador(l.nome2);
    const par = [j1, j2];
    par.slot = l.slot;
    confrontos.push(par);

    // Sem isto, uma rodada manual fica invisível para o pareamento das
    // rodadas automáticas seguintes e o confronto poderia se repetir.
    registrarConfronto(j1.nome, j2.nome);

    const pl = placares[l.slot];
    if (!pl) return;

    if (pl.p1 > pl.p2) j1.pontos += 3;
    else if (pl.p2 > pl.p1) j2.pontos += 3;
    else { j1.pontos += 1; j2.pontos += 1; }

    j1.saldo += pl.p1 - pl.p2;
    j2.saldo += pl.p2 - pl.p1;

    j1.historico.push({ contra: j2.nome, placar: `${pl.p1}x${pl.p2}`, rodada: rodada, gamesEmpatados: pl.emp });
    j2.historico.push({ contra: j1.nome, placar: `${pl.p2}x${pl.p1}`, rodada: rodada, gamesEmpatados: pl.emp });

    // Congela a linha na tela
    const i1 = document.getElementById(`r${rodada}_p${l.slot * 2}`);
    const tr = i1 && i1.parentElement ? i1.parentElement.parentElement : null;
    if (tr && tr.children[1]) {
      tr.children[0].textContent = j1.nome;
      tr.children[1].innerHTML = `<span>${pl.p1} x ${pl.p2}${pl.emp ? ` (${pl.emp} emp.)` : ""}</span>`;
      tr.children[2].textContent = j2.nome;
    }
  });

  // Congela também a linha do Bye
  confrontos.forEach(par => {
    if (!MTR.ehBye(par[1].nome)) return;
    const i1 = document.getElementById(`r${rodada}_p${par.slot * 2}`);
    const tr = i1 && i1.parentElement ? i1.parentElement.parentElement : null;
    if (tr && tr.children[1]) {
      tr.children[0].textContent = par[0].nome;
      tr.children[1].innerHTML = "<span>2 x 0</span>";
      tr.children[2].textContent = "Bye";
    }
  });

  return confrontos;
}

function finalizarRodada(rodada) {
  let confrontos = resultadosPorRodada[rodada];

  // Rodada manual — transação completa:
  //   ler pares -> validar pares -> ler placares -> validar placares -> APLICAR
  // Nenhuma mutação acontece antes de pares E placares estarem válidos, para um
  // placar faltando na última linha não deixar BYE, pontos, histórico e
  // confrontosAnteriores já gravados.
  if (!confrontos || confrontos.length === 0) {
    const leitura = lerRodadaManual(rodada);

    const errosPares = validarRodadaManual(leitura.linhas, rodada);
    if (errosPares.length) {
      alert("A rodada não pode ser finalizada:\n\n• " + errosPares.join("\n• "));
      return;   // nada tocado
    }

    const leituraPlacares = lerPlacaresManual(leitura.linhas, rodada);
    if (leituraPlacares.erros.length) {
      alert("A rodada não pode ser finalizada:\n\n• " + leituraPlacares.erros.join("\n• "));
      return;   // nada tocado — nem o BYE
    }

    confrontos = aplicarRodadaManual(leitura.linhas, leituraPlacares.placares, rodada);
    resultadosPorRodada[rodada] = confrontos;
    estadoRodadas[rodada] = "finalizada";

    ultimaRodadaFinalizada = Math.max(ultimaRodadaFinalizada, rodada);
    limparRascunho(rodada);
    salvarEstado();

    mostrarRanking();
    mostrarEstatisticasAppendixC();
    botoesProximaRodada(rodada);
    return;
  }

  // Placares também em duas fases: lê e valida TODOS antes de aplicar
  // qualquer um, para um placar em branco na última linha não deixar as
  // primeiras já gravadas.
  const placares = [];

  for (let i = 0; i < confrontos.length; i++) {
    const j1 = confrontos[i][0];
    const j2 = confrontos[i][1];

    // Lê pelo `slot` (a linha real na tabela), não pela posição no array.
    // Sem isso, uma linha vazia no pareamento manual faz o placar de um jogo
    // ser gravado em outro.
    const slot = (confrontos[i].slot !== undefined) ? confrontos[i].slot : i;
    const input1 = document.getElementById(`r${rodada}_p${slot * 2}`);
    const input2 = document.getElementById(`r${rodada}_p${slot * 2 + 1}`);

    // Linha do Bye não tem inputs: pontos e histórico já foram aplicados
    // na geração (automática) ou na fase de aplicação (manual).
    if (!input1 || !input2) continue;
    if (MTR.ehBye(j2.nome)) { placares.push({ i, slot, bye: true }); continue; }

    const p1 = parseInt(input1.value);
    const p2 = parseInt(input2.value);

    if (isNaN(p1) || isNaN(p2)) {
      alert(`Preencha todos os placares antes de finalizar (falta ${j1.nome} x ${j2.nome}).`);
      return;   // nada aplicado
    }

    // Games empatados: campo opcional, só existe se a coluna estiver ativa.
    const inputE = document.getElementById(`r${rodada}_e${slot}`);
    const emp = inputE && inputE.value !== "" ? parseInt(inputE.value) : 0;
    if (isNaN(emp) || emp < 0) {
      alert(`Empates de game inválidos em ${j1.nome} x ${j2.nome}.`);
      return;
    }

    placares.push({ i, slot, p1, p2, emp: emp || 0 });
  }

  // Tudo válido: aplica.
  placares.forEach(reg => {
    const j1 = confrontos[reg.i][0];
    const j2 = confrontos[reg.i][1];
    const input1 = document.getElementById(`r${rodada}_p${reg.slot * 2}`);
    const tr = input1 && input1.parentElement ? input1.parentElement.parentElement : null;
    const tdJog1 = tr ? tr.children[0] : null;
    const tdPlacar = tr ? tr.children[1] : null;
    const tdJog2 = tr ? tr.children[2] : null;

    if (reg.bye) {
      if (tdJog1 && tdJog2 && tdPlacar) {
        tdJog1.textContent = j1.nome;
        tdPlacar.innerHTML = "<span>2 x 0</span>";
        tdJog2.textContent = "Bye";
      }
      return;
    }

    const { p1, p2, emp } = reg;

    if (tdJog1 && tdJog2 && tdPlacar) {
      tdJog1.textContent = j1.nome;
      tdPlacar.innerHTML = `<span>${p1} x ${p2}${emp ? ` (${emp} emp.)` : ""}</span>`;
      tdJog2.textContent = j2.nome;
    }

    if (p1 > p2) j1.pontos += 3;
    else if (p2 > p1) j2.pontos += 3;
    else { j1.pontos += 1; j2.pontos += 1; }

    j1.saldo += p1 - p2;
    j2.saldo += p2 - p1;

    j1.historico.push({ contra: j2.nome, placar: `${p1}x${p2}`, rodada: rodada, gamesEmpatados: emp });
    j2.historico.push({ contra: j1.nome, placar: `${p2}x${p1}`, rodada: rodada, gamesEmpatados: emp });
  });

  estadoRodadas[rodada] = "finalizada";
  ultimaRodadaFinalizada = Math.max(ultimaRodadaFinalizada, rodada);
  limparRascunho(rodada);
  salvarEstado();

  mostrarRanking();
  mostrarEstatisticasAppendixC();
  botoesProximaRodada(rodada);
}

// Só é chamada depois de uma rodada ser efetivamente finalizada — é isso que
// impede a próxima rodada de ser oferecida com a atual ainda em andamento.
function botoesProximaRodada(rodada) {
  const area = document.getElementById("torneio-area");
  if (!area) return;

  const oldAuto = document.getElementById("btn-proxima-auto");
  const oldManual = document.getElementById("btn-proxima-manual");
  if (oldAuto) oldAuto.remove();
  if (oldManual) oldManual.remove();

  if (rodada < totalRodadas) {
    const botaoAuto = document.createElement("button");
    botaoAuto.id = "btn-proxima-auto";
    botaoAuto.textContent = "Gerar Próxima Rodada (automática)";
    botaoAuto.onclick = gerarRodada;
    area.appendChild(botaoAuto);

    const botaoManual = document.createElement("button");
    botaoManual.id = "btn-proxima-manual";
    botaoManual.textContent = "Gerar Próxima Rodada (manual)";
    botaoManual.onclick = gerarRodadaManual;
    area.appendChild(botaoManual);
  } else {
    const fim = document.createElement("h3");
    fim.textContent = "Fim do Torneio!";
    area.appendChild(fim);
  }
}



function mostrarRanking() {
  const area = document.getElementById("torneio-area");
  const existente = document.getElementById("ranking-atual");
  if (existente) existente.remove();

  // Mesma ordenação da tabela Appendix C: antes esta tabela ordenava por
  // pontos + saldo e podia apontar um campeão diferente do que aparecia
  // logo abaixo.
  const ranking = MTR.classificar(
    historicoParaJogos(jogadores.filter(j => !MTR.ehBye(j.nome)))
  );

  let html = "<div class='ranking' id='ranking-atual'><h3>Ranking Atual</h3>" +
             "<table><tr><th>#</th><th>Jogador</th><th>Pontos</th><th>V-D-E</th></tr>";
  ranking.forEach((j, i) => {
    html += `<tr><td>${i + 1}</td><td>${j.jogador}</td><td>${j.matchPoints}</td>` +
            `<td>${j.vitorias}-${j.derrotas}-${j.empates}</td></tr>`;
  });
  html += "</table></div>";
  area.innerHTML += html;
}






// Corrige os PLACARES da rodada atual. Os confrontos permanecem os mesmos —
// esta função nunca refaz um pareamento.
// `restaurando` = true quando chamada pela recuperação do localStorage, para
// redesenhar a tela sem revalidar nem alertar.
function corrigirPlacares(rodada, restaurando) {
  const confrontos = resultadosPorRodada[rodada];

  if (!confrontos || !confrontos.length) {
    if (!restaurando) alert("Esta rodada ainda não foi finalizada.");
    return;
  }

  // A regra vale no DOMÍNIO, não só na interface: além de ser a última rodada
  // finalizada, nenhuma rodada posterior pode ter sido gerada. Sem a segunda
  // condição, chamar a função direto pelo console corrigiria uma rodada que já
  // serviu de base para o pareamento seguinte.
  if (!restaurando &&
      (Number(rodada) !== Number(ultimaRodadaFinalizada) ||
       Number(rodada) !== Number(rodadaAtual))) {
    alert(
      `Só é possível corrigir os placares da rodada atual (Rodada ${rodadaAtual}), ` +
      `e apenas enquanto nenhuma rodada posterior tiver sido gerada.\n\n` +
      `A Rodada ${rodada} já foi usada para montar os pareamentos das rodadas seguintes; ` +
      `mudar o resultado dela agora tornaria esses pareamentos inconsistentes.`
    );
    return;
  }

  // Remove pontos, saldo e histórico APENAS desta rodada.
  // Antes o filtro era por adversário, então reabrir uma rodada apagava também
  // as partidas contra o mesmo adversário em outras rodadas.
  confrontos.forEach((par) => {
    if (MTR.ehBye(par[1].nome)) return;
    const j1 = jogadores.find(j => j.nome === par[0].nome);
    const j2 = jogadores.find(j => j.nome === par[1].nome);
    if (!j1 || !j2) return;

    const daRodada = h => h.contra === j2.nome && Number(h.rodada) === Number(rodada);
    const resultado = j1.historico.find(daRodada);
    if (!resultado) return;

    const p = MTR.parsePlacar(resultado.placar);
    if (!p) return;
    const [g1, g2] = p;

    if (g1 > g2) j1.pontos -= 3;
    else if (g2 > g1) j2.pontos -= 3;
    else {
      j1.pontos -= 1;
      j2.pontos -= 1;
    }
    j1.saldo -= g1 - g2;
    j2.saldo -= g2 - g1;

    // Remove só a entrada desta rodada
    j1.historico = j1.historico.filter(h => !(h.contra === j2.nome && Number(h.rodada) === Number(rodada)));
    j2.historico = j2.historico.filter(h => !(h.contra === j1.nome && Number(h.rodada) === Number(rodada)));
  });

  // Criar nova rodada com mesmo número
  const area = document.getElementById("torneio-area");
  const bloco = document.createElement("div");
  bloco.className = "rodada-bloco";
  bloco.id = "rodada_" + rodada + "_reaberta";
  estadoRodadas[rodada] = "corrigindo";
  bloco.innerHTML = `<h2>Rodada ${rodada} — Corrigindo Placares</h2>`;

  let html = '<table><thead><tr><th>Jogador 1</th><th>Placar</th><th>Jogador 2</th></tr></thead><tbody>';
  confrontos.forEach((par, i) => {
    if (par[1].nome === "Bye") {
      html += `<tr><td colspan="3">${par[0].nome} folga nesta rodada (Bye)</td></tr>`;
    } else {
      html += `
        <tr>
          <td>${par[0].nome}</td>
          <td class="placar-input">
            <input type="number" min="0" id="r${rodada}_p${i * 2}_r">
            <span>x</span>
            <input type="number" min="0" id="r${rodada}_p${i * 2 + 1}_r">
            <span class="emp-wrap" style="display:none"> emp:
              <input type="number" min="0" style="width:3em" id="r${rodada}_e${i}_r"></span>
          </td>
          <td>${par[1].nome}</td>
        </tr>
      `;
    }
  });
  html += '</tbody></table>';
  html += `<button onclick="finalizarCorrecao(${rodada})">Salvar Placares Corrigidos</button>`;
  bloco.innerHTML += html;
  area.appendChild(bloco);
  ligarAutosave(rodada);
  salvarEstado();
  if (!restaurando) alert("Corrija os placares e salve novamente.");
}

// Função para finalizar rodada reaberta
function finalizarCorrecao(rodada) {
  const confrontos = resultadosPorRodada[rodada];

  // Igual a finalizarRodada: lê e valida todos os placares antes de aplicar
  // qualquer um, para um campo em branco não deixar metade da rodada gravada.
  const lidos = [];

  for (let i = 0; i < confrontos.length; i++) {
    const j1 = confrontos[i][0];
    const j2 = confrontos[i][1];

    // Para partidas com Bye reabertas, não há inputs para editar
    if (MTR.ehBye(j2.nome)) continue;

    const input1 = document.getElementById(`r${rodada}_p${i * 2}_r`);
    const input2 = document.getElementById(`r${rodada}_p${i * 2 + 1}_r`);
    if (!input1 || !input2) continue; // segurança

    const p1 = parseInt(input1.value);
    const p2 = parseInt(input2.value);

    if (isNaN(p1) || isNaN(p2)) {
      alert(`Preencha todos os placares antes de finalizar (falta ${j1.nome} x ${j2.nome}).`);
      return;   // nada aplicado
    }

    const inputE = document.getElementById(`r${rodada}_e${i}_r`);
    const emp = inputE && inputE.value !== "" ? parseInt(inputE.value) : 0;
    if (isNaN(emp) || emp < 0) {
      alert(`Empates de game inválidos em ${j1.nome} x ${j2.nome}.`);
      return;
    }

    lidos.push({ i, p1, p2, emp: emp || 0, input1 });
  }

  lidos.forEach(reg => {
    const j1 = confrontos[reg.i][0];
    const j2 = confrontos[reg.i][1];
    const { p1, p2, emp } = reg;

    const tr = reg.input1.parentElement ? reg.input1.parentElement.parentElement : null;
    const tdPlacar = tr ? tr.children[1] : null;
    if (tdPlacar) {
      tdPlacar.innerHTML = `<span>${p1} x ${p2}${emp ? ` (${emp} emp.)` : ""}</span>`;
    }

    if (p1 > p2) j1.pontos += 3;
    else if (p2 > p1) j2.pontos += 3;
    else { j1.pontos += 1; j2.pontos += 1; }

    j1.saldo += p1 - p2;
    j2.saldo += p2 - p1;

    j1.historico.push({ contra: j2.nome, placar: `${p1}x${p2}`, rodada: rodada, gamesEmpatados: emp });
    j2.historico.push({ contra: j1.nome, placar: `${p2}x${p1}`, rodada: rodada, gamesEmpatados: emp });
  });

  estadoRodadas[rodada] = "finalizada";
  ultimaRodadaFinalizada = Math.max(ultimaRodadaFinalizada, rodada);
  limparRascunho(rodada);
  salvarEstado();

  mostrarRanking();
  mostrarEstatisticasAppendixC();
  botoesProximaRodada(rodada);
}


//Função para calculo do Appendix_c

function mostrarEstatisticasAppendixC() {
  const area = document.getElementById("torneio-area");
  const existente = document.getElementById("appendix-c");
  if (existente) existente.remove(); // Remove tabela anterior

  // Toda a matemática vem do mtr.js (validado por tests/run.js). Antes esta
  // função tinha a própria implementação, que divergia da usada no pareamento.
  const stats = MTR.classificar(
    historicoParaJogos(jogadores.filter(j => !MTR.ehBye(j.nome)))
  );

  if (!stats.length) return;

  let html = `<div class='ranking' id='appendix-c'>
    <h3>📊 Estatísticas Avançadas (Appendix C)</h3>
    <p style="font-size:.85em;opacity:.75">Desempate oficial: MP → OMW% → GW% → OGW%</p>
    <table><tr><th>#</th><th>Jogador</th><th>MP</th><th>MW%</th><th>GW%</th><th>OMW%</th><th>OGW%</th></tr>`;

  stats.forEach((s, i) => {
    html += `<tr>
      <td>${i + 1}</td>
      <td>${s.jogador}</td>
      <td>${s.matchPoints}</td>
      <td>${(s.matchWinPerc * 100).toFixed(1)}%</td>
      <td>${(s.gameWinPerc * 100).toFixed(1)}%</td>
      <td>${(s.omwp * 100).toFixed(1)}%</td>
      <td>${(s.ogwp * 100).toFixed(1)}%</td>
    </tr>`;
  });

  html += "</table>";

  // O 1º da lista já é o campeão pelos critérios oficiais.
  const campeao = stats[0];
  // Usa o comparador oficial: comparar campo a campo aqui deixava o piso do
  // GW% de fora e não reconhecia como empate um 25% x 30% (ambos valem 33%).
  const empatado = !!stats[1] && MTR.estaoEmpatadosNosCriterios(campeao, stats[1]);

  html += `
    <h3 style="margin-top: 30px; color: gold;">🏆 Campeão: ${campeao.jogador}</h3>`;

  if (empatado) {
    html += `<p style="color:#ffcc66">⚠️ ${campeao.jogador} e ${stats[1].jogador} empataram
      em todos os quatro critérios oficiais — o desempate precisa ser feito fora do sistema.</p>`;
  }

  html += "</div>";

  area.innerHTML += html;
}

// Função PURA de exportação: recebe o estado e devolve os objetos no formato
// do jogos.json. É esta que a suíte de testes exercita — a UI abaixo só
// acrescenta prompt, Blob e download, para o teste não validar uma cópia.
function montarJogosExportados(resultados, liga, dia) {
  const jogosExportados = [];

  Object.keys(resultados)
    .map(Number)
    .sort((a, b) => a - b)
    .forEach(rodada => {
      const confrontos = resultados[rodada] || [];

      confrontos.forEach(par => {
        const j1 = par[0];
        const j2 = par[1];

        // O Bye É exportado: o jogos.json precisa dessa linha, senão o site
        // deixa de contar a rodada para o jogador no Match Win %.
        if (MTR.ehBye(j2.nome)) {
          jogosExportados.push({
            liga: liga,
            dia: dia,
            rodada: rodada,
            jogador1: j1.nome,
            resultado: "2 x 0",
            jogador2: "Bye"
          });
          return;
        }

        // O placar sai do histórico do jogador, não da tabela na tela: é a
        // mesma fonte que alimenta o ranking, então export e ranking nunca
        // divergem (antes o export dependia da posição da linha no DOM).
        const entrada = (j1.historico || []).find(
          h => h.contra === j2.nome && Number(h.rodada) === Number(rodada)
        );
        if (!entrada) return;

        const p = MTR.parsePlacar(entrada.placar);
        if (!p) return;

        const linha = {
          liga: liga,
          dia: dia,
          rodada: rodada,
          jogador1: j1.nome,
          resultado: `${p[0]} x ${p[1]}`,
          jogador2: j2.nome
        };

        // Campo opcional: só aparece quando houve game empatado, para as
        // linhas normais continuarem idênticas ao formato de sempre.
        if (entrada.gamesEmpatados) linha.gamesEmpatados = entrada.gamesEmpatados;

        jogosExportados.push(linha);
      });
    });

  return jogosExportados;
}

function exportarResultadosParaJSON() {
  if (!ligaAtual || ligaAtual < 1) {
    alert("Defina o número da Liga no início do torneio antes de exportar.");
    return;
  }

  const numeroDia = parseInt(prompt("Digite o número do dia (ex: 5):", "5"));
  if (!numeroDia || numeroDia < 1) return;
  diaAtual = numeroDia;

  const jogosExportados = montarJogosExportados(resultadosPorRodada, ligaAtual, numeroDia);

  if (jogosExportados.length === 0) {
    alert("Nenhum jogo válido para exportar. Verifique se as rodadas foram finalizadas.");
    return;
  }

  // 🔥 Formato “uma linha por objeto”, igual vocês gostam no jogos.json
  const linhas = jogosExportados.map(o =>
    `{ "liga": ${o.liga}, "dia": ${o.dia}, "rodada": ${o.rodada}, "jogador1": "${o.jogador1}", ` +
    `"resultado": "${o.resultado}", "jogador2": "${o.jogador2}"` +
    (o.gamesEmpatados ? `, "gamesEmpatados": ${o.gamesEmpatados}` : "") +
    ` }`
  );

  // JSON válido (sem vírgula sobrando no final)
  const conteudo = "[\n" + linhas.join(",\n") + "\n]\n";

  const blob = new Blob([conteudo], { type: "application/json" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);

  const hoje = new Date();
  const dd = String(hoje.getDate()).padStart(2, "0");
  const mm = String(hoje.getMonth() + 1).padStart(2, "0");
  const yyyy = hoje.getFullYear();

  link.download = `resultados_${dd}-${mm}-${yyyy}.json`;
  link.click();
}
